name: Local Support Security

on:
  pull_request:
    paths:
      - "backend/vectant-local-support-app/**"
      - "synthi/src/app/api/local-support/**"
      - "synthi/src/components/local-support/**"
      - "synthi/src/lib/local-support/**"
      - "synthi/prisma/**"
      - "tests/local-support-admin.spec.ts"
      - "tests/local-support-desktop-shell.spec.ts"
      - "tests/local-support-transparency.spec.ts"
      - ".github/workflows/local-support-security.yml"
      - ".github/workflows/local-support-release.yml"
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - "backend/vectant-local-support-app/**"
      - "synthi/src/app/api/local-support/**"
      - "synthi/src/components/local-support/**"
      - "synthi/src/lib/local-support/**"
      - "synthi/prisma/**"
      - "tests/local-support-admin.spec.ts"
      - "tests/local-support-desktop-shell.spec.ts"
      - "tests/local-support-transparency.spec.ts"
      - ".github/workflows/local-support-security.yml"
      - ".github/workflows/local-support-release.yml"

permissions:
  contents: read

jobs:
  rust-local-support:
    name: Rust local support app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path backend/vectant-local-support-app/Cargo.toml --check

      - name: Run clippy
        run: cargo clippy --manifest-path backend/vectant-local-support-app/Cargo.toml --all-targets -- -D warnings

      - name: Run security tests
        run: cargo test --manifest-path backend/vectant-local-support-app/Cargo.toml

      - name: Confirm production package excludes the live test daemon
        shell: pwsh
        run: |
          cargo build --manifest-path backend/vectant-local-support-app/Cargo.toml --release
          if (Test-Path backend/vectant-local-support-app/target/release/local-support-test-daemon.exe) {
            throw "Feature-gated live test daemon leaked into the production package."
          }

      - name: Check desktop formatting
        run: cargo fmt --manifest-path backend/vectant-local-support-app/desktop/Cargo.toml --check

      - name: Run desktop clippy
        run: cargo clippy --manifest-path backend/vectant-local-support-app/desktop/Cargo.toml --all-targets -- -D warnings

      - name: Run desktop integration tests
        run: cargo test --manifest-path backend/vectant-local-support-app/desktop/Cargo.toml

  web-local-support:
    name: Web local support gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused local support tests
        run: >
          npm run test --workspace synthi --
          src/lib/local-support/acceptance.test.js
          src/lib/local-support/controlPlane.test.js
          src/lib/local-support/adminStore.test.js
          src/lib/local-support/nextConfigHeaders.test.js
          src/lib/local-support/pairingStore.test.js
          src/lib/local-support/policyStore.test.js
          src/lib/local-support/relayPayloadStore.test.js
          src/lib/local-support/relayStore.test.js
          src/lib/local-support/securityEventStore.test.js
          src/lib/local-support/sessionStore.test.js
          src/lib/local-support/transparencyStore.test.js
          src/app/api/local-support/httpGuards.test.js
          src/app/api/local-support/request-envelope/route.test.js
          src/app/api/local-support/relay/route.test.js
          src/app/api/local-support/preview-gateway/route.test.js
          src/app/api/local-support/admin/state/route.test.js
          src/app/api/local-support/policy/route.test.js
          src/app/api/local-support/security-event/route.test.js
          src/app/api/local-support/transparency-action/route.test.js
          src/app/api/local-support/transparency-state/route.test.js
          src/app/api/local-support/pairing/route.test.js

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run transparency browser E2E
        shell: pwsh
        env:
          VECTANT_TEST_BASE_URL: http://127.0.0.1:3000
        run: |
          $out = Join-Path $env:RUNNER_TEMP "local-support-next.out.log"
          $err = Join-Path $env:RUNNER_TEMP "local-support-next.err.log"
          $server = Start-Process -FilePath "npx.cmd" -ArgumentList @("next", "dev", "--hostname", "127.0.0.1", "--port", "3000") -WorkingDirectory "synthi" -RedirectStandardOutput $out -RedirectStandardError $err -WindowStyle Hidden -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            do {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:3000/local-support" -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -lt 500) { break }
              } catch {
                Start-Sleep -Seconds 2
              }
            } while ((Get-Date) -lt $deadline)
            npx playwright test tests/local-support-transparency.spec.ts --project=chromium --reporter=line
            npx playwright test tests/local-support-admin.spec.ts --project=chromium --reporter=line
            npx playwright test tests/local-support-desktop-shell.spec.ts --project=chromium --reporter=line
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Get-Content $out -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue

      - name: Run real loopback daemon Playwright gate
        shell: pwsh
        run: npx playwright test tests/local-support-live-daemon.spec.ts --project=chromium --reporter=line
          }

      - name: Audit production web dependencies
        run: npm audit --workspace synthi --omit=dev --audit-level=high

      - name: Build web app
        run: npm run build --workspace synthi

  local-support-postgres-migrations:
    name: Local Support PostgreSQL migration gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U validation -d validation"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate and apply all Prisma migrations
        working-directory: synthi
        env:
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
        run: |
          npx prisma validate --schema prisma/schema.prisma
          npx prisma migrate deploy --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma
      - name: Exercise durable emergency controls against PostgreSQL
        working-directory: synthi
        env:
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
          LOCAL_SUPPORT_POSTGRES_E2E: "1"
        run: npm run test -- src/lib/local-support/postgres.integration.test.js

  local-support-live-cloud:
    name: Live local-support web and PostgreSQL gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U validation -d validation"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations and generate Prisma Client
        working-directory: synthi
        env:
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
        run: |
          npx prisma migrate deploy --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Rust and desktop build dependencies
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - name: Start real Next server
        env:
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
          VECTANT_LOCAL_SUPPORT_ADMIN_TOKEN: live-ci-admin-token-0123456789
          VECTANT_LOCAL_SUPPORT_ENVELOPE_SECRET: live-ci-envelope-secret-0123456789
          VECTANT_LOCAL_SUPPORT_DEVICE_PROOF_SECRET: live-ci-device-proof-secret-0123456789
          VECTANT_LOCAL_SUPPORT_RELAY_PAYLOAD_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          nohup npm run dev --workspace synthi -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/local-support-next.log" 2>&1 &
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:3100/local-support >/dev/null && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/local-support-next.log"
          exit 1
      - name: Run browser-to-cloud policy gate
        env:
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
          VECTANT_LOCAL_SUPPORT_ADMIN_TOKEN: live-ci-admin-token-0123456789
          LOCAL_SUPPORT_LIVE_CLOUD_E2E: "1"
          VECTANT_TEST_BASE_URL: http://localhost:3100
        run: npx playwright test tests/local-support-live-cloud.spec.ts --project=chromium --reporter=line
      - name: Run browser-to-Rust relay and revoke gate
        env:
          DATABASE_URL: postgresql://validation:validation@127.0.0.1:5432/validation
          VECTANT_LOCAL_SUPPORT_ADMIN_TOKEN: live-ci-admin-token-0123456789
          VECTANT_LOCAL_SUPPORT_ENVELOPE_SECRET: live-ci-envelope-secret-0123456789
          VECTANT_LOCAL_SUPPORT_DEVICE_PROOF_SECRET: live-ci-device-proof-secret-0123456789
          VECTANT_LOCAL_SUPPORT_RELAY_PAYLOAD_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          LOCAL_SUPPORT_LIVE_RELAY_E2E: "1"
          VECTANT_TEST_BASE_URL: http://localhost:3100
        run: npx playwright test tests/local-support-live-relay.spec.ts --project=chromium --reporter=line

  supply-chain:
    name: Supply chain checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust audit tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --manifest-path backend/vectant-local-support-app/Cargo.toml --deny warnings

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: local-support-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-support-sbom
          path: local-support-sbom.cdx.json
