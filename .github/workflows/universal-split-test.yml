name: universal-split-corpus
# ULTRAPLAN Phase 7 — library-agnostic universal split regression gate.
#
# Runs the corpus suite against a fresh ai-engine process, validating
# that the universal split prompt still produces structurally correct
# manifests across the 11-project corpus. Gated on PRs that touch the
# prompts / build manifest / diff patch helpers / compile_manifest —
# other PRs skip the (Gemini-API-burning) run to keep CI budget
# reasonable. Full run is ~$0.05 and ~1-3 minutes.

on:
  pull_request:
    paths:
      - 'ai-backend/ai-engine/llm/prompts.py'
      - 'ai-backend/ai-engine/build_manifest.py'
      - 'ai-backend/ai-engine/diff_patch_helpers.py'
      - 'ai-backend/ai-engine/main.py'
      - 'ai-backend/ai-engine/tests/corpus/**'
      - 'ai-backend/ai-engine/tests/test_universal_split.py'
      - 'backend/synthi-webrtc-compiler/worker/src/hmr/compile_manifest.rs'
      - '.github/workflows/universal-split-test.yml'
  # Manual trigger for investigating prompt drift outside a PR
  workflow_dispatch:

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ai-engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-backend/ai-engine/requirements.txt

      - name: Start ai-engine in background
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ai-backend/ai-engine
          # Start on 0.0.0.0 so the subsequent curl can reach it
          nohup python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 \
            > /tmp/ai-engine.log 2>&1 &
          echo "AI_ENGINE_PID=$!" >> $GITHUB_ENV

      - name: Wait for ai-engine to be ready
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/ > /dev/null 2>&1; then
              echo "ai-engine responding after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ai-engine failed to start within 30s — log tail:"
          tail -80 /tmp/ai-engine.log
          exit 1

      - name: Run universal split corpus suite
        env:
          AI_ENGINE_URL: http://localhost:8000
        run: |
          cd ai-backend/ai-engine
          python3 tests/test_universal_split.py --url http://localhost:8000

      - name: Dump ai-engine log on failure
        if: failure()
        run: |
          echo "─── ai-engine.log (last 200 lines) ───"
          tail -200 /tmp/ai-engine.log || true

      - name: Stop ai-engine
        if: always()
        run: |
          if [ -n "$AI_ENGINE_PID" ]; then
            kill $AI_ENGINE_PID 2>/dev/null || true
          fi
