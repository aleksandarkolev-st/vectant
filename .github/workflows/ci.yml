name: CI

# Lightweight test CI. The only other workflow (deploy-prod.yml) just ships images
# on push to main; this runs unit tests on branches/PRs. Scoped by path so it only
# fires for the programs-mcp package and the backend files its drift guard mirrors.
on:
  push:
    paths:
      - 'packages/programs-mcp/**'
      - 'synthi/src/lib/programs/hostEscape.js'
      - 'synthi/src/lib/programs/manifest.js'
      - 'ai-backend/ai-engine/analyzer/proactive/healing/failure_distiller.py'
      - 'ai-backend/ai-engine/analyzer/proactive/healing/failure_distiller_adapters.py'
      - 'ai-backend/ai-engine/bench/failure_distiller/**'
      - 'ai-backend/ai-engine/test/test_failure_distiller_benchmark.py'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'packages/programs-mcp/**'
      - 'synthi/src/lib/programs/hostEscape.js'
      - 'synthi/src/lib/programs/manifest.js'
      - 'ai-backend/ai-engine/analyzer/proactive/healing/failure_distiller.py'
      - 'ai-backend/ai-engine/analyzer/proactive/healing/failure_distiller_adapters.py'
      - 'ai-backend/ai-engine/bench/failure_distiller/**'
      - 'ai-backend/ai-engine/test/test_failure_distiller_benchmark.py'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  programs-mcp:
    name: programs-mcp tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install only this package's deps (SDK + vitest), standalone — not the
      # Monaco-heavy monorepo. --workspaces=false stops npm from resolving the
      # whole workspace graph. The drift guard reads backend files by path (they
      # are pure ESM, no install needed) from the full checkout.
      - name: Install deps (isolated)
        working-directory: packages/programs-mcp
        run: npm install --no-audit --no-fund --no-package-lock --include-workspace-root=false --workspaces=false

      - name: Test
        working-directory: packages/programs-mcp
        run: npm test

  failure-distiller-benchmark:
    name: Failure Distiller benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pytest runner
        run: python -m pip install --disable-pip-version-check pytest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Synthi Vitest runner
        working-directory: synthi
        run: npm ci --ignore-scripts

      - name: Run threshold-enforced benchmark
        working-directory: ai-backend/ai-engine
        run: >-
          python bench/failure_distiller/run.py
          --json failure-distiller-benchmark.json
          --markdown failure-distiller-benchmark.md

      - name: Publish benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-distiller-benchmark
          path: |
            ai-backend/ai-engine/failure-distiller-benchmark.json
            ai-backend/ai-engine/failure-distiller-benchmark.md
