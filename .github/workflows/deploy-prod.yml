name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional immutable image tag. Defaults to prod-<sha>-<run number>."
        required: false
        type: string
      enable_vulnerability_scan:
        description: "Fail deploy when Artifact Analysis reports critical vulnerabilities."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: vectant-proj
  REGION: europe-west10
  GKE_CLUSTER: synthi-beta-cluster
  GKE_ZONE: europe-west10-a
  REGISTRY: europe-west10-docker.pkg.dev/vectant-proj/synthi

jobs:
  deploy:
    name: Submit Cloud Build
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit production Cloud Build
        env:
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag || '' }}
          REQUESTED_SCAN: ${{ github.event.inputs.enable_vulnerability_scan || 'false' }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_IMAGE_TAG}" ]]; then
            IMAGE_TAG="${REQUESTED_IMAGE_TAG}"
          else
            IMAGE_TAG="prod-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid Docker tag: ${IMAGE_TAG}" >&2
            exit 1
          fi

          gcloud builds submit . \
            --project="${PROJECT_ID}" \
            --config=cloudbuild.yaml \
            --ignore-file=.gcloudignore \
            --substitutions="_REGION=${REGION},_GKE_CLUSTER=${GKE_CLUSTER},_GKE_ZONE=${GKE_ZONE},_REGISTRY=${REGISTRY},_IMAGE_TAG=${IMAGE_TAG},_ENABLE_VULNERABILITY_SCAN=${REQUESTED_SCAN}"
