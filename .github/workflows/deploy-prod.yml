name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional immutable image tag. Defaults to prod-<sha>-<run number>."
        required: false
        type: string
      kustomize_dir:
        description: "Kustomize render directory. Defaults to the Dojo production release overlay."
        required: false
        type: string
        default: "k8s/overlays/dojo-release-gate"
      kustomize_load_restrictor:
        description: "Optional Kustomize load restrictor. Use LoadRestrictionsNone only for reviewed overlays."
        required: false
        type: string
        default: "LoadRestrictionsNone"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: vectant-proj
  REGION: europe-west10
  GKE_CLUSTER: synthi-beta-cluster
  GKE_ZONE: europe-west10-a
  REGISTRY: europe-west10-docker.pkg.dev/vectant-proj/synthi

jobs:
  deploy:
    name: Submit Cloud Build
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for CodeSite release gate
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: CodeSite release gate
        run: npm --prefix synthi run codesite:release-gate -- --proof-root tmp/codesite-dojo-proof

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit production Cloud Build
        env:
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag || '' }}
          REQUESTED_KUSTOMIZE_DIR: ${{ github.event.inputs.kustomize_dir || 'k8s/overlays/dojo-release-gate' }}
          REQUESTED_KUSTOMIZE_LOAD_RESTRICTOR: ${{ github.event.inputs.kustomize_load_restrictor || 'LoadRestrictionsNone' }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_IMAGE_TAG}" ]]; then
            IMAGE_TAG="${REQUESTED_IMAGE_TAG}"
          else
            IMAGE_TAG="prod-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid Docker tag: ${IMAGE_TAG}" >&2
            exit 1
          fi

          KUSTOMIZE_DIR="${REQUESTED_KUSTOMIZE_DIR}"
          KUSTOMIZE_LOAD_RESTRICTOR="${REQUESTED_KUSTOMIZE_LOAD_RESTRICTOR}"
          normalize_kustomize_dir() {
            printf '%s' "$1" | sed -e 's#//*#/#g' -e 's#^\./##' -e 's#/\./#/#g' -e 's#/$##'
          }
          KUSTOMIZE_DIR="$(normalize_kustomize_dir "${KUSTOMIZE_DIR}")"
          if [[ "${KUSTOMIZE_DIR}" = /* || "${KUSTOMIZE_DIR}" == *..* ]]; then
            echo "Kustomize dir must be a relative repo path without '..': ${KUSTOMIZE_DIR}" >&2
            exit 1
          fi
          if [[ ! -f "${KUSTOMIZE_DIR}/kustomization.yaml" ]]; then
            echo "Kustomize dir does not contain kustomization.yaml: ${KUSTOMIZE_DIR}" >&2
            exit 1
          fi
          if [[ -n "${KUSTOMIZE_LOAD_RESTRICTOR}" && "${KUSTOMIZE_LOAD_RESTRICTOR}" != "LoadRestrictionsNone" ]]; then
            echo "Unsupported Kustomize load restrictor: ${KUSTOMIZE_LOAD_RESTRICTOR}" >&2
            exit 1
          fi

          gcloud builds submit . \
            --project="${PROJECT_ID}" \
            --config=cloudbuild.yaml \
            --ignore-file=.gcloudignore \
            --substitutions="_REGION=${REGION},_GKE_CLUSTER=${GKE_CLUSTER},_GKE_ZONE=${GKE_ZONE},_REGISTRY=${REGISTRY},_IMAGE_TAG=${IMAGE_TAG},_KUSTOMIZE_DIR=${KUSTOMIZE_DIR},_KUSTOMIZE_LOAD_RESTRICTOR=${KUSTOMIZE_LOAD_RESTRICTOR}"
