<svg width="1180" height="560" viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect width="1180" height="560" fill="#020617"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="19" font-weight="bold">Trust infrastructure — three layers of distrust</text>
  <text x="40" y="68" fill="#64748b" font-size="11">never let a claim substitute for proof · never let proof substitute for scope</text>

  <!-- three columns -->
  <g>
    <rect x="40" y="100" width="350" height="330" rx="10" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="1.4"/>
    <text x="215" y="130" text-anchor="middle" fill="#fb923c" font-size="13">AGENT DOJO</text>
    <text x="215" y="150" text-anchor="middle" fill="#94a3b8" font-size="9.5">"may this SKILL do this action?"</text>
    <g font-size="10" fill="#cbd5e1">
      <rect x="65" y="170" width="300" height="30" rx="6" fill="#0f172a"/><text x="80" y="190">Skill Seed</text>
      <rect x="65" y="210" width="300" height="30" rx="6" fill="#0f172a"/><text x="80" y="230">Workspace Organoid (11 tissues)</text>
      <rect x="65" y="250" width="300" height="30" rx="6" fill="#0f172a"/><text x="80" y="270">Wind Tunnel + Evil Twin trials</text>
      <rect x="65" y="290" width="300" height="30" rx="6" fill="#0f172a"/><text x="80" y="310">Checkride → entrustment E0–EX</text>
      <rect x="65" y="330" width="300" height="36" rx="6" fill="rgba(52,211,153,0.12)" stroke="#34d399"/>
      <text x="80" y="352" fill="#34d399">License Kernel gates every prod call</text>
    </g>
    <text x="215" y="405" text-anchor="middle" fill="#64748b" font-size="9">69 synthi_dojo_* tools · proof-carrying capsules</text>
  </g>

  <g>
    <rect x="415" y="100" width="350" height="330" rx="10" fill="rgba(34,211,238,0.07)" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="590" y="130" text-anchor="middle" fill="#22d3ee" font-size="13">CODESITE (ATC)</text>
    <text x="590" y="150" text-anchor="middle" fill="#94a3b8" font-size="9.5">"may this SESSION write RIGHT NOW?"</text>
    <g font-size="10" fill="#cbd5e1">
      <rect x="440" y="170" width="300" height="30" rx="6" fill="#0f172a"/><text x="455" y="190">flight plan filed</text>
      <rect x="440" y="210" width="300" height="30" rx="6" fill="#0f172a"/><text x="455" y="230">MutationLease granted</text>
      <rect x="440" y="250" width="300" height="30" rx="6" fill="#0f172a"/><text x="455" y="270">transaction overlay + quarantine</text>
      <rect x="440" y="290" width="300" height="30" rx="6" fill="#0f172a"/><text x="455" y="310">CodeSiteFS path/symlink containment</text>
      <rect x="440" y="330" width="300" height="36" rx="6" fill="rgba(34,211,238,0.12)" stroke="#22d3ee"/>
      <text x="455" y="352" fill="#22d3ee">fail-closed if authority unreachable</text>
    </g>
    <text x="590" y="405" text-anchor="middle" fill="#64748b" font-size="9">70 synthi_codesite_* tools · airspace classes A–D</text>
  </g>

  <g>
    <rect x="790" y="100" width="350" height="330" rx="10" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1.4"/>
    <text x="965" y="130" text-anchor="middle" fill="#fb7185" font-size="13">LOCAL SUPPORT APP</text>
    <text x="965" y="150" text-anchor="middle" fill="#94a3b8" font-size="9.5">"what LEFT this machine, to WHOM?"</text>
    <g font-size="10" fill="#cbd5e1">
      <rect x="815" y="170" width="300" height="30" rx="6" fill="#0f172a"/><text x="830" y="190">ed25519 pairing + DPAPI at-rest</text>
      <rect x="815" y="210" width="300" height="30" rx="6" fill="#0f172a"/><text x="830" y="230">L0–L5 egress classification</text>
      <rect x="815" y="250" width="300" height="30" rx="6" fill="#0f172a"/><text x="830" y="270">secret scan + redaction pre-send</text>
      <rect x="815" y="290" width="300" height="30" rx="6" fill="#0f172a"/><text x="830" y="310">shell-free command broker + Job Objects</text>
      <rect x="815" y="330" width="300" height="36" rx="6" fill="rgba(251,113,133,0.14)" stroke="#fb7185"/>
      <text x="830" y="352" fill="#fb7185">hash-chained audit · pause/revoke instantly</text>
    </g>
    <text x="965" y="405" text-anchor="middle" fill="#64748b" font-size="8">read-only · session-scoped · local app = final authority</text>
  </g>

  <!-- composition arrows -->
  <path d="M 390 265 C 400 265, 402 265, 413 265" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M 765 265 C 776 265, 778 265, 788 265" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#p)"/>
  <text x="400" y="255" fill="#64748b" font-size="8.5">capsule as input to clearance</text>
  <text x="762" y="285" fill="#64748b" font-size="8.5">lease required for runtime writes</text>

  <!-- product law band -->
  <rect x="40" y="460" width="1100" height="60" rx="8" fill="rgba(136,19,55,0.16)" stroke="#fb7185" stroke-dasharray="4,4"/>
  <text x="590" y="485" text-anchor="middle" fill="#fda4af" font-size="10">PRODUCT LAW — proof not reassurance · visible boundaries · stop controls close · fail closed + explain why</text>
  <text x="590" y="505" text-anchor="middle" fill="#94a3b8" font-size="8.5">channels: auto-open only in direct_preferred · registered_direct keeps handshake · ids derived from live state only</text>
</svg>
