  <rect width="1180" height="700" fill="#020617"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="19" font-weight="bold">Who calls whom — logical dependency map</text>
  <text x="40" y="68" fill="#64748b" font-size="11">arrow = initiates contact · colors: cyan=frontend · green=control · amber=rust/media · violet=AI/data · orange=agents</text>

