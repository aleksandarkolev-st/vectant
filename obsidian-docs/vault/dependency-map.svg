  <path d="M 155 186 C 155 260, 350 320, 440 448" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity=".55" stroke-dasharray="4,3" marker-end="url(#c)"/>
  <text x="130" y="300" fill="#67e8f9" font-size="8.5">webrtc media+DC direct to worker</text>

  <!-- legend note -->
  <rect x="60" y="580" width="1060" height="80" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="80" y="606" fill="#e2e8f0" font-size="11">Failure coupling (learned live)</text>
  <text x="80" y="628" fill="#94a3b8" font-size="10">worker DNS crash-loop ⇒ signaling died first · CSP binds frontend to collab origin · ai-engine outage degrades split/heal but never blocks plain editing</text>
  <text x="80" y="646" fill="#64748b" font-size="9">startup order: postgres → redis → y-sweet → signaling(+coturn) → collab → frontend+migrate → ai-engine → gateway → mcp</text>
