services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synthi
      POSTGRES_PASSWORD: password
      POSTGRES_DB: synthi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  y-sweet:
    build: 
      context: ./backend/y-sweet
      dockerfile: Dockerfile
    image: synthi-y-sweet
    ports:
      - "8180:8080"
    volumes:
      - ysweet-data:/data
    restart: unless-stopped
    command: y-sweet serve /data --host 0.0.0.0 --port 8080
    environment:
      - Y_SWEET_AUTH_KEY=dev-secret

  # ── Core Services ──────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./synthi
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_COLLAB_SERVER_URL: "http://localhost:1234"
        NEXT_PUBLIC_YSWEET_URL: "http://localhost:8180"
        NEXT_PUBLIC_COLLAB_PORT: "1234"
        NEXT_PUBLIC_COMPILE_SIGNAL_URL: "ws://localhost:9000"
        NEXT_PUBLIC_GATEWAY_WS_URL: "ws://localhost:7070/ws"
    ports:
      - "3000:3000"
    environment:
      # Auth (NextAuth.js)
      NEXTAUTH_URL: "http://localhost:3000/"
      NEXTAUTH_SECRET: "YOUR_SECURE_RANDOM_SECRET_KEY"
      AUTH_SECRET: "YOUR_SECURE_RANDOM_SECRET_KEY"
      # Database
      DATABASE_URL: "postgres://synthi:testNegrocito123_@34.32.85.168/synthi"
      # OAuth Providers
      GITHUB_ID: "Ov23liSHBwbfjvZhwD6n"
      GITHUB_SECRET: "1a3f9f34861adfa600ea00fb1d619ea74ff4957c"
