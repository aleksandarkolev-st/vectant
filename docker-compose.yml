      CLOUDFLARE_TURN_TOKEN_ID: ""
      CLOUDFLARE_TURN_API_TOKEN: ""
      # Local TURN (returned to browser via /api/turn-credentials)
      LOCAL_TURN_URL: "turn:localhost:3478"
      LOCAL_TURN_USERNAME: "synthi"
      LOCAL_TURN_CREDENTIAL: "synthi"
      # Public URLs
      NEXT_PUBLIC_GATEWAY_WS_URL: "ws://localhost:7070/ws"
    depends_on:
      postgres:
        condition: service_healthy

  collab-server:
    build:
      context: ./backend/collab-server
      dockerfile: Dockerfile
    ports:
      - "1234:1234"
    environment:
      COLLAB_PORT: "1234"
      SPAWNER_MODE: "local"
      # Local TURN (returned to worker via /turn-credentials)
      LOCAL_TURN_URL: "turn:coturn:3478"
      LOCAL_TURN_USERNAME: "synthi"
      LOCAL_TURN_CREDENTIAL: "synthi"
      # Networking
      CORS_ORIGIN: "http://localhost:3000"
      CODE_INTEL_URL: "http://ai-engine:8000"
      YSWEET_URL: "http://y-sweet:8080"
      YSWEET_AUTH_KEY: dev-secret
      # Storage (Local dev uses filesystem instead of GCS)
      REPOS_DIR: /data/repos
      REPO_CACHE_DIR: /data/repos
      # Database
      CLOUD_SQL_INSTANCE: "" # Not used in local dev
      # Dev specific
      GCS_SYNC_ON_FLUSH: "false"
    volumes:
      - collab-data:/data
    depends_on:
      - y-sweet
      - ai-engine

  signaling-server:
    build:
      context: ./backend/synthi-webrtc-compiler/signaling-server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      SIGNALING_PORT: "9000"
      REDIS_URL: "redis://redis:6379"
      COLLAB_SERVER_URL: "http://collab-server:1234"
    depends_on:
      redis:
        condition: service_healthy
      collab-server:
        condition: service_started

  ai-engine:
    build:
      context: ./ai-backend/ai-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # API Keys
      GOOGLE_AI_API_KEY: "AIzaSyBFGyMQ7muhz_vz5E8Ug5uFoRtSZLTK4ys"
      GEMINI_API_KEY: "AIzaSyBFGyMQ7muhz_vz5E8Ug5uFoRtSZLTK4ys"
      SYNTHI_AI_MODEL: "gemini-3-flash-preview-preview"
      OPENAI_API_KEY: "dummy"

  ai-gateway:
    build:
      context: ./ai-backend/gateway
      dockerfile: Dockerfile
    ports:
      - "7070:7070"
    environment:
      GATEWAY_PORT: "7070"
      GATEWAY_WS_PATH: "/ws"
      BACKEND_URL: "http://ai-engine:8000"
      GATEWAY_CLUSTER: "false"
    depends_on:
      - ai-engine

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    command: >
      --no-tls
      --no-dtls
      --lt-cred-mech
      --user=synthi:synthi
      --realm=synthi.local
      --no-cli
      --fingerprint
      --min-port=49152
      --max-port=49200
      --listening-ip=0.0.0.0
      --external-ip=192.168.100.107
      --allowed-peer-ip=0.0.0.0-255.255.255.255
      --verbose
      --log-file=stdout
    restart: unless-stopped

  worker:
    build:
      context: ./backend/synthi-webrtc-compiler/worker
      dockerfile: Dockerfile
    environment:
      # No SESSION_ID → worker registers as "__legacy__" in signaling server,
      # which lets it accept ANY browser session (local-dev single-worker mode).
      SIGNALING_URL: "ws://signaling-server:9000"
      COLLAB_SERVER_URL: "http://collab-server:1234"
      AI_BACKEND_URL: "http://ai-engine:8000"
      # GStreamer
      GST_DEBUG: "2"
      DISPLAY: ":99"
      # Logging
      SYNTHI_LOG_LEVEL: "debug"
      # Capture full panic backtraces — without this a Rust panic just
      # prints the message and thread name, which makes fmt / webrtc
      # internal panics invisible to root-cause. `full` gives us the
      # complete file:line chain instead of just the top frame.
      RUST_BACKTRACE: "full"
      RUST_LIB_BACKTRACE: "full"
      # Turn on debug_log! output so the new force-key-unit + candidate
      # buffer log lines are visible during this debugging session.
      SYNTHI_WORKER_VERBOSE: "1"
    depends_on:
      - signaling-server
      - collab-server

volumes:
  ysweet-data:
  postgres-data:
  collab-data: