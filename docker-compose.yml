services:
  y-sweet:
    build: 
      context: ./backend/y-sweet
      dockerfile: Dockerfile
    image: synthi-y-sweet
    ports:
      - "8180:8080"
    volumes:
      - ysweet-data:/data
    restart: unless-stopped
    command: y-sweet serve /data --host 0.0.0.0 --port 8080

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  ysweet-data:
