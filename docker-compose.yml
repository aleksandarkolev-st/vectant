services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: synthi
      POSTGRES_PASSWORD: password
      POSTGRES_DB: synthi
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  y-sweet:
    build: 
      context: ./backend/y-sweet
      dockerfile: Dockerfile
    image: synthi-y-sweet
    ports:
      - "127.0.0.1:${YSWEET_HOST_PORT:-8180}:8080"
    volumes:
      - ysweet-data:/data
    restart: unless-stopped
    command: y-sweet serve /data --host 0.0.0.0 --port 8080
    environment:
      - Y_SWEET_AUTH_KEY=dev-secret
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Core Services ──────────────────────────────────────────────────────────

  frontend-migrate:
    build:
      context: .
      dockerfile: synthi/Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_COLLAB_SERVER_URL: "http://localhost:${COLLAB_HOST_PORT:-1234}"
        NEXT_PUBLIC_YSWEET_URL: "http://localhost:${YSWEET_HOST_PORT:-8180}"
        NEXT_PUBLIC_COLLAB_PORT: "${COLLAB_HOST_PORT:-1234}"
        NEXT_PUBLIC_COMPILE_SIGNAL_URL: "ws://localhost:${SIGNALING_HOST_PORT:-9000}"
        NEXT_PUBLIC_GATEWAY_WS_URL: "ws://localhost:${AI_GATEWAY_HOST_PORT:-7071}/ws"
        NEXT_PUBLIC_CODE_INTEL_URL: "http://localhost:${AI_ENGINE_HOST_PORT:-8081}"
        NEXT_PUBLIC_AI_ENGINE_URL: "http://localhost:${AI_ENGINE_HOST_PORT:-8081}"
        NEXT_PUBLIC_SYNTHI_WORKSPACE_AUTH_BYPASS: "${NEXT_PUBLIC_SYNTHI_WORKSPACE_AUTH_BYPASS:-}"
    working_dir: /app/synthi
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: "postgresql://synthi:password@postgres:5432/synthi"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      # npm-workspace build: root context so synthi can resolve the
      # @synthi/mcp-hub workspace package (see synthi/Dockerfile).
      context: .
      dockerfile: synthi/Dockerfile
      args:
        NEXT_PUBLIC_COLLAB_SERVER_URL: "http://localhost:${COLLAB_HOST_PORT:-1234}"
        NEXT_PUBLIC_YSWEET_URL: "http://localhost:${YSWEET_HOST_PORT:-8180}"
        NEXT_PUBLIC_COLLAB_PORT: "${COLLAB_HOST_PORT:-1234}"
        NEXT_PUBLIC_COMPILE_SIGNAL_URL: "ws://localhost:${SIGNALING_HOST_PORT:-9000}"
        NEXT_PUBLIC_GATEWAY_WS_URL: "ws://localhost:${AI_GATEWAY_HOST_PORT:-7071}/ws"
        NEXT_PUBLIC_CODE_INTEL_URL: "http://localhost:${AI_ENGINE_HOST_PORT:-8081}"
        NEXT_PUBLIC_AI_ENGINE_URL: "http://localhost:${AI_ENGINE_HOST_PORT:-8081}"
        NEXT_PUBLIC_SYNTHI_WORKSPACE_AUTH_BYPASS: "${NEXT_PUBLIC_SYNTHI_WORKSPACE_AUTH_BYPASS:-}"
    env_file:
      - path: ./.env.local
        required: false
        # Browser-side code-intel / provenance hooks call the ai-engine via a
        # public host URL, not the compose-network hostname. Default to 8081
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      # Read-only workspace mirror for server-side CodeSite snapshot validation.
      # Runtime mutation surfaces still use managed overlays/quarantine paths.
      - .:/workspace:ro
      # Writable CodeSite artifact projection root. Release proofs verify these
      # files from tmp/codesite-dojo-proof/app-artifacts/<workspace-slug>/...
      - ./tmp/codesite-dojo-proof/app-artifacts:/codesite-app-artifacts
    environment:
      # Non-secret local defaults. Auth, OAuth, DB, GCP, and AI credentials
      # are loaded from the gitignored .env.local file.
      NEXTAUTH_URL: "http://localhost:${FRONTEND_HOST_PORT:-3000}/"
      SYNTHI_APP_INTERNAL_URL: "http://frontend:3000"
      # Shared secret that authenticates the collab-server's server-to-server
      # CodeSite control-plane probe (requireCodesiteAccess accepts it as an
      # internal-service token). MUST match the collab-server value below.
      # Production must inject a real secret via SYNTHI_CODESITE_TOKEN.
      SYNTHI_CODESITE_TOKEN: "${SYNTHI_CODESITE_TOKEN:-local-compose-codesite-token}"
      # Permit the local Docker frontend to reach a Jupyter server exposed on
      # the host or private LAN. Public servers still require HTTPS.
      JUPYTER_ALLOW_DOCKER_HOST: "${JUPYTER_ALLOW_DOCKER_HOST:-1}"
      JUPYTER_ALLOW_PRIVATE_HTTP: "${JUPYTER_ALLOW_PRIVATE_HTTP:-1}"
      # Local-compose auth secret used by NextAuth. Production deployments must
      # provide AUTH_SECRET/NEXTAUTH_SECRET through their secret manager.
      AUTH_SECRET: "${AUTH_SECRET:-local-compose-auth-secret}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-local-compose-auth-secret}"
      # Local Compose must use the database service, never a host .env URL.
      DATABASE_URL: "postgresql://synthi:password@postgres:5432/synthi"
      SYNTHI_CODESITE_ARTIFACT_ROOT: "/codesite-app-artifacts"
      # Mature CodeSite shadow proofs execute isolated repo-command universes.
      # The runner reads from the read-only /workspace mirror and copies each
      # universe to /tmp before applying patches or running checks.
      SYNTHI_CODESITE_SHADOW_RUNNER_COMMAND_JSON: '["node","/workspace/synthi/scripts/codesite-shadow-runner.mjs"]'
      SYNTHI_CODESITE_SHADOW_RUNNER_ALLOWED_ROOT: "/workspace"
      SYNTHI_CODESITE_SHADOW_RUNNER_ALLOW_INLINE_COMMANDS: "1"
      # GCP / Storage metadata
      GCP_PROJECT_ID: "overview-synti"
      GCS_BUCKET_NAME: "synthi-cloud-storage"
      # Cloudflare TURN (not used locally — local coturn handles relay)
      CLOUDFLARE_TURN_TOKEN_ID: ""
      CLOUDFLARE_TURN_API_TOKEN: ""
      # Local TURN (returned to browser via /api/turn-credentials)
      LOCAL_TURN_URL: "turn:localhost:${TURN_HOST_PORT:-3478}"
      LOCAL_TURN_USERNAME: "synthi"
      LOCAL_TURN_CREDENTIAL: "synthi"
      # Public URLs
      NEXT_PUBLIC_GATEWAY_WS_URL: "ws://localhost:${AI_GATEWAY_HOST_PORT:-7071}/ws"
      # Inside the compose network the ai-engine is reachable as `ai-engine:8000`,
      # not localhost. Used by RAG fast-context, NEP edit-impact, shadow flows, agent.
      CODE_INTEL_URL: "http://ai-engine:8000"
      NEXT_PUBLIC_CODE_INTEL_URL: "http://localhost:${AI_ENGINE_HOST_PORT:-8081}"
      NEXT_PUBLIC_AI_ENGINE_URL: "http://localhost:${AI_ENGINE_HOST_PORT:-8081}"
      NEXT_PUBLIC_SYNTHI_WORKSPACE_AUTH_BYPASS: "${NEXT_PUBLIC_SYNTHI_WORKSPACE_AUTH_BYPASS:-}"
      # Server-side (API routes) reach the collab-server by its compose hostname,
      # not localhost. Without this, program manifest discovery / install / launch
      # / publish fall back to localhost:1234 inside this container and fail.
      COLLAB_SERVER_URL: "http://collab-server:1234"
      # Match collab-server's gate so the default marketplace seed ships the
      # Dev Container as a real `container` program (not managed commands).
      ENABLE_CONTAINER_RUNTIME: "1"
      # Optional proof-authority material. Local proof runs pass ephemeral
      # Ed25519 keys through *_FILE vars mounted from /workspace/tmp so proof
      # bundles can be verified with pinned public authorities without storing
      # private keys in the repository or image.
      SYNTHI_CODESITE_PROOF_AUTHORITY_KEY_ID: "${SYNTHI_CODESITE_PROOF_AUTHORITY_KEY_ID:-}"
      SYNTHI_CODESITE_PROOF_AUTHORITY_NAME: "${SYNTHI_CODESITE_PROOF_AUTHORITY_NAME:-}"
      SYNTHI_CODESITE_PROOF_AUTHORITY_SECRET: "${SYNTHI_CODESITE_PROOF_AUTHORITY_SECRET:-}"
      SYNTHI_CODESITE_PROOF_AUTHORITY_SECRET_FILE: "${SYNTHI_CODESITE_PROOF_AUTHORITY_SECRET_FILE:-}"
      SYNTHI_CODESITE_PROOF_AUTHORITY_PRIVATE_KEY_PEM: "${SYNTHI_CODESITE_PROOF_AUTHORITY_PRIVATE_KEY_PEM:-}"
      SYNTHI_CODESITE_PROOF_AUTHORITY_PRIVATE_KEY_PEM_FILE: "${SYNTHI_CODESITE_PROOF_AUTHORITY_PRIVATE_KEY_PEM_FILE:-}"
      SYNTHI_CODESITE_PROOF_AUTHORITY_PUBLIC_KEY_PEM: "${SYNTHI_CODESITE_PROOF_AUTHORITY_PUBLIC_KEY_PEM:-}"
      SYNTHI_CODESITE_PROOF_AUTHORITY_PUBLIC_KEY_PEM_FILE: "${SYNTHI_CODESITE_PROOF_AUTHORITY_PUBLIC_KEY_PEM_FILE:-}"
      SYNTHI_CODESITE_PROOF_AUTHORITY_PUBLIC_KEYS_JSON: "${SYNTHI_CODESITE_PROOF_AUTHORITY_PUBLIC_KEYS_JSON:-}"
      SYNTHI_CODESITE_PROOF_AUTHORITY_PUBLIC_KEYS_JSON_FILE: "${SYNTHI_CODESITE_PROOF_AUTHORITY_PUBLIC_KEYS_JSON_FILE:-}"
      SYNTHI_CODESITE_PROOF_REQUIRE_TRUSTED_AUTHORITY: "${SYNTHI_CODESITE_PROOF_REQUIRE_TRUSTED_AUTHORITY:-}"
    depends_on:
      frontend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      y-sweet:
        condition: service_healthy
      ai-engine:
        condition: service_started

  collab-server:
    build:
      context: ./backend/collab-server
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${COLLAB_HOST_PORT:-1234}:1234"
    environment:
      COLLAB_PORT: "1234"
      # Terminal gateway tokens are signed by the frontend. The collab server
      # must verify them with the same secret or every terminal WebSocket is
      # rejected after a runtime repair succeeds.
      AUTH_SECRET: "${AUTH_SECRET:-local-compose-auth-secret}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-local-compose-auth-secret}"
      SPAWNER_MODE: "local"
      SYNTHI_WORKSPACE_AUTH_BYPASS: "${NEXT_PUBLIC_SYNTHI_WORKSPACE_AUTH_BYPASS:-}"
      # Local TURN (returned to worker via /turn-credentials)
      LOCAL_TURN_URL: "turn:coturn:3478"
      LOCAL_TURN_USERNAME: "synthi"
      LOCAL_TURN_CREDENTIAL: "synthi"
      # Networking
      CORS_ORIGIN: "http://localhost:${FRONTEND_HOST_PORT:-3000}"
      SYNTHI_APP_INTERNAL_URL: "http://frontend:3000"
      # Explicit CodeSite authority endpoint. Runtime filesystem hydration must
      # verify transaction state against this route; generic app-origin settings
      # are intentionally not treated as a CodeSite authority.
      SYNTHI_CODESITE_API_BASE_URL: "http://frontend:3000/api/workspace/{workspace_slug}/codesite"
      # Sent as `Authorization: Bearer` on the CodeSite control-plane probe to
      # the frontend (see controlPlaneHeaders). MUST match the frontend value.
      SYNTHI_CODESITE_TOKEN: "${SYNTHI_CODESITE_TOKEN:-local-compose-codesite-token}"
      CODE_INTEL_URL: "http://ai-engine:8000"
      YSWEET_URL: "http://y-sweet:8080"
      YSWEET_AUTH_KEY: dev-secret
      # Redis — backs per-file version history + missed-event tray.
      # Without this, persistence.saveFileVersion silently no-ops and
      # the FileVersionsPanel shows "No history yet" after every save.
      REDIS_URL: "redis://redis:6379"
      # Storage (Local dev uses filesystem instead of GCS)
      REPOS_DIR: /data/repos
      REPO_CACHE_DIR: /data/repos
      # Database
      CLOUD_SQL_INSTANCE: "" # Not used in local dev
      # Dev specific
      GCS_SYNC_ON_FLUSH: "false"
      # Native Docker (hybrid Phase 1): run `container`-type programs in a
      # per-workspace rootless-Docker runtime container. Requires the host
      # docker socket mount below so collab-server can manage those containers.
      ENABLE_CONTAINER_RUNTIME: "1"
      RUNTIME_IMAGE: "vectant-runtime:local"
      # Workspace-prep (auto dependency install) and the local worker spawner
      # default WORKER_IMAGE to `synthi-worker:local`, which doesn't exist in this
      # dev stack — compose builds the worker as `synthi-ide-worker:latest`. Point
      # them at the real local tag so prep doesn't try to pull from Docker Hub
      # (which 404s: "pull access denied for synthi-worker").
      WORKER_IMAGE: "synthi-ide-worker:latest"
      # collab-server runs as a container here, so the per-workspace runtime
      # container must reach repo files via the SHARED collab-data named volume
      # (a host-path bind would resolve on the host and be empty). Value is the
      # explicitly named volume used by this Compose stack.
      WORKSPACE_DATA_VOLUME: "vectant-ade_collab-data"
      # The rootless per-workspace runtime uses gid 1000. The collab process
      # joins that group so both trusted local actors can edit only the same
      # setgid workspace tree without opening it to every container user.
      SYNTHI_RUNTIME_SHARED_GID: "${SYNTHI_RUNTIME_SHARED_GID:-1000}"
      SYNTHI_RUNTIME_WORKSPACE_UMASK: "${SYNTHI_RUNTIME_WORKSPACE_UMASK:-0002}"
      # Runtime and worker containers must join this stack's explicit network.
      WORKER_NETWORK: "vectant-ade_default"
    volumes:
      - collab-data:/data
      # Used ONLY by collab-server to manage per-workspace runtime containers.
      # Never mounted into a runtime container or exposed to program env.
      - /var/run/docker.sock:/var/run/docker.sock
    # collab-server runs as the non-root `synthi` user, but the bind-mounted
    # docker socket is owned by root:root (mode 660), so dockerode would get
    # EACCES. Grant the socket's group. On Docker Desktop the socket is gid 0;
    # on a native Linux host set DOCKER_SOCKET_GID to the host `docker` group.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
      - "${SYNTHI_RUNTIME_SHARED_GID:-1000}"
    depends_on:
      redis:
        condition: service_healthy
      y-sweet:
        condition: service_healthy
      ai-engine:
        condition: service_started

  signaling-server:
    build:
      context: ./backend/synthi-webrtc-compiler/signaling-server
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${SIGNALING_HOST_PORT:-9000}:9000"
    environment:
      SIGNALING_PORT: "9000"
      REDIS_URL: "redis://redis:6379"
      COLLAB_SERVER_URL: "http://collab-server:1234"
    depends_on:
      redis:
        condition: service_healthy
      collab-server:
        condition: service_started

  ai-engine:
    build:
      context: ./ai-backend/ai-engine
      dockerfile: Dockerfile
    env_file:
      - path: ./.env.local
        required: false
    ports:
      # Keep container port 8000 stable for inter-service traffic, but avoid
      # assuming the Windows host can also bind 8000.
      - "127.0.0.1:${AI_ENGINE_HOST_PORT:-8081}:8000"
    # ai-engine needs access to the same workspace files collab-server
    # writes. Without this mount, /code-intel/edit-impact can't index any
    # workspace and returns empty candidates — NEP loses the entire cross-
    # file impact graph. Read-write is required: the CodeIntel engine
    # persists its index under <workspace_root>/.code_intel and previously
    # 500'd on every workspace load with "Read-only file system".
    volumes:
      - collab-data:/data
      # Failure Distiller launches only its hardened, network-disabled
      # capsules through the host OCI daemon. The engine itself receives no
      # workspace bind beyond collab-data; individual runs bind each active
      # workspace read-only and drop all capabilities in ContainerExecutor.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # Docker Desktop exposes its Linux socket as root:root (0660).
      - "0"
    environment:
      SYNTHI_AI_MODEL: "gemini-3.1-flash-lite-preview"
      SYNTHI_GEMINI_MODEL: "${SYNTHI_GEMINI_MODEL:-}"
      SYNTHI_AI_ENGINE_WORKERS: "${SYNTHI_AI_ENGINE_WORKERS:-1}"
      AI_ENGINE_AUTH_DISABLED: "${AI_ENGINE_AUTH_DISABLED:-true}"
      # GEMINI_API_KEY / GOOGLE_API_KEY are supplied via the env_file (.env.local)
      # above. Do NOT redeclare them here as "${VAR:-}" — an empty interpolated
      # value in `environment:` overrides the env_file and silently strips the
      # key, which makes the embedder raise "Embedding API key is not configured"
      # and every /code-intel/* call 500.
      OPENAI_API_KEY: "dummy"
      # Tell resolve_workspace_path() where to find slug-rooted repos.
      # The collab-data named volume is shared with collab-server (which
      # writes); we don't need depends_on because the volume is created
      # independently of service startup order — and adding one would cycle
      # against collab-server's existing depends_on: ai-engine.
      SYNTHI_REPOS_PATH: "/data/repos"
      # The local dev image is pinned and must be present before a capsule is
      # accepted; ContainerExecutor also invokes Docker with --pull=never.
      VECTANT_FAILURE_DISTILLER_ALLOWED_IMAGES: "${VECTANT_FAILURE_DISTILLER_ALLOWED_IMAGES:-python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a}"

  ai-gateway:
    build:
      context: ./ai-backend/gateway
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${AI_GATEWAY_HOST_PORT:-7071}:7070"
    environment:
      GATEWAY_PORT: "7070"
      GATEWAY_WS_PATH: "/ws"
      BACKEND_URL: "http://ai-engine:8000"
      GATEWAY_CLUSTER: "false"
      GATEWAY_AUTH_DISABLED: "true"
      GATEWAY_AUTH_ALLOW_INSECURE_LOCAL: "true"
    depends_on:
      - ai-engine

  coturn:
    image: coturn/coturn:4.7.0-r2@sha256:203b9bf51e84199f91025d411a7bcc7358d50c43a4d9c588079e282a3bbf4ba1
    ports:
      - "127.0.0.1:${TURN_HOST_PORT:-3478}:3478"
      - "127.0.0.1:${TURN_HOST_PORT:-3478}:3478/udp"
      - "127.0.0.1:${TURN_RELAY_HOST_PORT_RANGE:-49152-49200}:49152-49200/udp"

    command: >
      --no-tls
      --no-dtls
      --lt-cred-mech
      --user=synthi:synthi
      --realm=synthi.local
      --no-cli
      --fingerprint
      --min-port=49152
      --max-port=49200
      --listening-ip=0.0.0.0
      --verbose
      --log-file=stdout

    restart: unless-stopped

  # Synthi MCP — sleeper container on the default compose network.
  # live-test.mjs uses `docker exec -i synthi-ide-mcp-1 node /app/dist/index.js`
  # so MCP runs inside docker and shares a subnet with `worker`. The two peers
  # then pair directly via host ICE candidates (172.18.0.x ↔ 172.18.0.x) and
  # skip TURN entirely — which is what we want, since both sides would
  # otherwise allocate on the same coturn and trip coturn's self-peer-IP
  # block (403 Forbidden IP on CREATE_PERMISSION for --external-ip).
  mcp:
    build:
      # Root context so the MCP package can resolve packages/mcp-hub, matching
      # the Cloud Build image layout.
      context: .
      dockerfile: mcp/synthi-mcp/Dockerfile
    ports:
      # Expose Prometheus /metrics to the host so live-test.mjs can scrape
      # http://127.0.0.1:9464/metrics without a second `docker exec`.
      - "127.0.0.1:${MCP_METRICS_HOST_PORT:-9464}:9464"
    depends_on:
      - signaling-server
      - worker
    environment:
      AI_BACKEND_URL: "http://ai-engine:8000"
    restart: unless-stopped

  worker:
    build:
      context: ./backend/synthi-webrtc-compiler/worker
      dockerfile: Dockerfile
      args:
        # The base compose stack must run on ordinary local/CI hosts. GPU
        # toolchains and devices are enabled by the AMD/NVIDIA overlays.
        WORKER_CARGO_FEATURES: "${WORKER_CARGO_FEATURES:-gpu-hmr}"
        INSTALL_ROCM: "${INSTALL_ROCM:-false}"
    # If the worker process dies (e.g. an unhandled panic, or an X11 IO
    # handler trip during reset tear-down) we want the container to come
    # back up automatically, the same way every other service in this
    # compose file does. Without this the worker stays dead and every
    # subsequent compile silently hangs.
    restart: unless-stopped
    environment:
      # No SESSION_ID → worker registers as "__legacy__" in signaling server,
      # which lets it accept ANY browser session (local-dev single-worker mode).
      SIGNALING_URL: "ws://signaling-server:9000"
      COLLAB_SERVER_URL: "http://collab-server:1234"
      AI_BACKEND_URL: "http://ai-engine:8000"
      SYNTHI_REPOS_PATH: "/data/repos"
      SYNTHI_GEMINI_MODEL: "${SYNTHI_GEMINI_MODEL:-}"
      # GStreamer
      GST_DEBUG: "2"
      DISPLAY: ":99"
      # Logging
      SYNTHI_LOG_LEVEL: "debug"
      # Capture full panic backtraces — without this a Rust panic just
      # prints the message and thread name, which makes fmt / webrtc
      # internal panics invisible to root-cause. `full` gives us the
      # complete file:line chain instead of just the top frame.
      RUST_BACKTRACE: "full"
      RUST_LIB_BACKTRACE: "full"
      # Turn on debug_log! output so the new force-key-unit + candidate
      # buffer log lines are visible during this debugging session.
      SYNTHI_WORKER_VERBOSE: "1"
      SYNTHI_VSCODE_VERBOSE: "1"
      # GPU overlays opt into device-backed HMR. The base stack stays host-only
      # so Docker health/proof gates do not depend on /dev/dxg or nvidia-smi.
      SYNTHI_GPU_HMR: "${SYNTHI_GPU_HMR:-0}"
      HSA_ENABLE_DXG_DETECTION: "${HSA_ENABLE_DXG_DETECTION:-}"
    volumes:
      - collab-data:/data:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ipc: private
    shm_size: "8gb"
    depends_on:
      - signaling-server
      - collab-server

volumes:
  ysweet-data:
  postgres-data:
  collab-data:
