# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Kustomization (apply all manifests in order)
# ─────────────────────────────────────────────────────────────────────────────
#
#  Apply everything:   kubectl apply -k k8s/
#
#  Or apply individually in dependency order:
#    kubectl apply -f k8s/namespace.yaml
#    kubectl apply -f k8s/secrets.yaml
#    kubectl apply -f k8s/configmap.yaml
#    kubectl apply -f k8s/spawner-rbac.yaml
#    kubectl apply -f k8s/postgres.yaml
#    kubectl apply -f k8s/redis.yaml
#    kubectl apply -f k8s/ai-engine.yaml
#    kubectl apply -f k8s/ai-gateway.yaml
#    kubectl apply -f k8s/collab-server.yaml
#    kubectl apply -f k8s/signaling-server.yaml
#    kubectl apply -f k8s/frontend.yaml
#    kubectl apply -f k8s/worker.yaml
#    kubectl apply -f k8s/ingress.yaml
#    kubectl apply -f k8s/network-policies.yaml
#    kubectl apply -f k8s/pod-disruption-budgets.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: synthi

resources:
  # 1. Foundation
  - namespace.yaml
  - secrets.yaml             # Beta default: simple K8s Secret for synthi-secrets
  # - external-secrets.yaml  # Enable after installing External Secrets Operator CRDs
  - configmap.yaml
  - spawner-rbac.yaml

  # 2. Datastores
  - postgres.yaml
  - redis.yaml

  # 3. Backend services (order: no inter-dependencies at startup)
  - ai-engine.yaml
  - ai-gateway.yaml
  - y-sweet.yaml
  - collab-server.yaml
  - signaling-server.yaml

  # 4. Frontend + workers (depend on backend services)
  - frontend.yaml
  - worker.yaml

  # 5. Ingress (depends on all services existing)
  - ingress.yaml

  # 6. Production hardening
  - network-policies.yaml
  - pod-disruption-budgets.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: synthi-ide
