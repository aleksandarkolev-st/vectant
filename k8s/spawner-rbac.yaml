# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — RBAC for Workspace Spawner
# ─────────────────────────────────────────────────────────────────────────────
#  Grants the collab-server ServiceAccount permission to manage
#  workspace Deployments, watch Pods, and manage per-workspace Services
#  in the synthi namespace. The spawner creates/patches/deletes
#  opaque runtime Deployments and Services named "rt-<base32-hmac>".
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collab-server-sa
  namespace: synthi
  labels:
    app: collab-server
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    iam.gke.io/gcp-service-account: synthi-gcs-sa@vectant-proj.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: synthi
  labels:
    app: frontend
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    iam.gke.io/gcp-service-account: synthi-gcs-sa@vectant-proj.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: y-sweet-sa
  namespace: synthi
  labels:
    app: y-sweet
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    iam.gke.io/gcp-service-account: synthi-gcs-sa@vectant-proj.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-runtime-sa
  namespace: synthi
  labels:
    app: workspace
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    iam.gke.io/gcp-service-account: synthi-gcs-sa@vectant-proj.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-spawner
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
rules:
  # The spawner lists, creates, patches, deletes, and watches Deployments.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete", "watch"]
  # Watch pods to detect Running state and PodIP readiness.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Read one-shot workspace preparation logs.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Open interactive shells inside per-runtime pods for the terminal service.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # Create/delete ClusterIP Services per workspace for health checks.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  # Run one-shot workspace preparation tasks such as dependency installs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete", "watch"]
  # Poll one-shot workspace preparation Job status.
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collab-server-spawner
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
subjects:
  - kind: ServiceAccount
    name: collab-server-sa
    namespace: synthi
roleRef:
  kind: Role
  name: workspace-spawner
  apiGroup: rbac.authorization.k8s.io
