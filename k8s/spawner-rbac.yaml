# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — RBAC for Workspace Spawner
# ─────────────────────────────────────────────────────────────────────────────
#  Grants the collab-server ServiceAccount permission to manage
#  workspace Deployments, watch Pods, and manage per-workspace Services
#  in the synthi namespace. The spawner creates/patches/deletes
#  Deployments named "workspace-*" and Services named "ws-svc-*".
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collab-server-sa
  namespace: synthi
  labels:
    app: collab-server
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    iam.gke.io/gcp-service-account: synthi-gcs-sa@overview-synti.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-spawner
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
rules:
  # The spawner lists, creates, patches, deletes, and watches Deployments.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete", "watch"]
  # Watch pods to detect Running state and PodIP readiness.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Create/delete ClusterIP Services per workspace for health checks.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collab-server-spawner
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
subjects:
  - kind: ServiceAccount
    name: collab-server-sa
    namespace: synthi
roleRef:
  kind: Role
  name: workspace-spawner
  apiGroup: rbac.authorization.k8s.io
