# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Secrets
# ─────────────────────────────────────────────────────────────────────────────
#  Replace placeholder values with base64-encoded production secrets.
#
#  Encode a value:   echo -n 'my-secret' | base64
#
#  In production, manage these with GCP Secret Manager + External Secrets
#  Operator instead of checking them into version control.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: synthi-secrets
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
type: Opaque
data:
  # ── PostgreSQL (via Cloud SQL Auth Proxy sidecar) ─────────────────────────
  # The proxy runs as a sidecar in the same pod, so the app connects to
  # 127.0.0.1:5432.  The proxy handles IAM auth + TLS to Cloud SQL.
  #
  # echo -n 'postgresql://synthi:CHANGEME@127.0.0.1:5432/synthi' | base64
  DATABASE_URL: cG9zdGdyZXNxbDovL3N5bnRoaTpDSEFOR0VNRUBAMTI3LjAuMC4xOjU0MzIvc3ludGhp
  POSTGRES_USER: c3ludGhp
  POSTGRES_PASSWORD: Q0hBTkdFTUU=
  POSTGRES_DB: c3ludGhp

  # ── NextAuth / OAuth ────────────────────────────────────────────────────────
  # echo -n 'CHANGEME' | base64
  AUTH_SECRET: Q0hBTkdFTUU=
  NEXTAUTH_SECRET: Q0hBTkdFTUU=
  GOOGLE_CLIENT_ID: Q0hBTkdFTUU=
  GOOGLE_CLIENT_SECRET: Q0hBTkdFTUU=
  GITHUB_ID: Q0hBTkdFTUU=
  GITHUB_SECRET: Q0hBTkdFTUU=

  # ── GCS (Google Cloud Storage) ──────────────────────────────────────────────
  # Prefer Workload Identity in production. These are the fallback for
  # service-account key auth.
  GCP_CLIENT_EMAIL: Q0hBTkdFTUU=
  GCP_PRIVATE_KEY: Q0hBTkdFTUU=

  # ── Cloudflare TURN ─────────────────────────────────────────────────────────
  CLOUDFLARE_TURN_TOKEN_ID: Q0hBTkdFTUU=
  CLOUDFLARE_TURN_API_TOKEN: Q0hBTkdFTUU=

  # ── AI Provider Keys ────────────────────────────────────────────────────────
  # Used by the AI engine (Gemini / OpenAI).
  GOOGLE_AI_API_KEY: Q0hBTkdFTUU=
  OPENAI_API_KEY: Q0hBTkdFTUU=
