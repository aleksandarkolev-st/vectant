# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Y-Sweet (Yrs/CRDT document server)
# ─────────────────────────────────────────────────────────────────────────────
#  Handles:
#    - Yjs WebSocket relay (standard sync protocol)
#    - CRDT document persistence to GCS
#    - Horizontal scaling — each pod is stateless; GCS is the store
#
#  Docs: https://github.com/jamsocket/y-sweet
#  Image: ghcr.io/jamsocket/y-sweet
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: y-sweet
  namespace: synthi
  labels:
    app: y-sweet
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: synthi-ide
spec:
  replicas: 1    # Beta floor — keep a single relay warm until Cloud Run cutover.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: y-sweet
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: synthi-ide
  template:
    metadata:
      labels:
        app: y-sweet
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: synthi-ide
    spec:
      securityContext:
        #runAsNonRoot: true
      nodeSelector:
        cloud.google.com/gke-nodepool: core-pool
      containers:
        - name: y-sweet
          image: ghcr.io/jamsocket/y-sweet:latest@sha256:d61ba0fa5671cc522e3f4a4c0f6cafbccbfbe66561a9ddba40041e14a22bcff0
          command: ['y-sweet']
          args:
            - serve
            - --host=0.0.0.0
            - --port=8080
          ports:
            - containerPort: 8080
              name: http-ws
          env:
            # ── Storage ─────────────────────────────────────────────────────
            # Y-Sweet persists CRDT state to a GCS bucket.
            # Format: gcs://<bucket>/<prefix>
            - name: Y_SWEET_STORE
              value: "gcs://$(GCS_BUCKET_NAME)/ysweet"
            - name: GCS_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: GCS_BUCKET_NAME
            # GCS auth via Workload Identity or service-account key
            - name: GCP_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: GCP_CLIENT_EMAIL
            - name: GCP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: GCP_PRIVATE_KEY
            # ── Auth ────────────────────────────────────────────────────────
            - name: Y_SWEET_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: YSWEET_AUTH_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            tcpSocket:
                port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
                port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: y-sweet
  namespace: synthi
  labels:
    app: y-sweet
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    cloud.google.com/backend-config: '{"default": "ws-backend-config"}'
    cloud.google.com/neg: '{"exposed_ports":{"8080":{"name":"y-sweet-alb-neg"}}}'
spec:
  selector:
    app: y-sweet
  ports:
    - port: 8080
      targetPort: 8080
      name: http-ws

---
# Keep a single warm relay for beta, but allow burst scaling when multiple
# users are collaborating at once.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: y-sweet-hpa
  namespace: synthi
  labels:
    app: y-sweet
    app.kubernetes.io/part-of: synthi-ide
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: y-sweet
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
