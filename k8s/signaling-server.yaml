# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Signaling Server (Rust, 2+ replicas, Redis Pub/Sub)
# ─────────────────────────────────────────────────────────────────────────────
#  Session-multiplexed WebSocket signaling relay for WebRTC.
#  Stateless — all session state is in Redis. Safe to scale horizontally.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling-server
  namespace: synthi
  labels:
    app: signaling-server
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: synthi-ide
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signaling-server
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: synthi-ide
  template:
    metadata:
      labels:
        app: signaling-server
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: synthi-ide
    spec:
      securityContext:
        #runAsNonRoot: true
      nodeSelector:
        cloud.google.com/gke-nodepool: core-pool
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: signaling-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: signaling
          image: europe-west10-docker.pkg.dev/overview-synti/synthi/synthi-signaling-server:latest
          ports:
            - containerPort: 9000
              name: ws
          env:
            - name: SIGNALING_PORT
              value: "9000"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: REDIS_URL
            - name: COLLAB_SERVER_URL
              value: "http://collab-server:1234"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: healthz
          image: hashicorp/http-echo:0.2.3
          args:
            - "-listen=:8080"
            - "-text=ok"
          ports:
            - containerPort: 8080
              name: health
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: signaling-server
  namespace: synthi
  labels:
    app: signaling-server
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    cloud.google.com/neg: '{"exposed_ports":{"9000":{"name":"signaling-server-alb-neg"}}}'
spec:
  selector:
    app: signaling-server
  ports:
    - port: 9000
      targetPort: 9000
      name: ws
    - port: 8080
      targetPort: 8080
      name: health

---
# Keep one always-on signaling pod for beta, but allow short bursts when
# concurrent workspace sessions increase.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: signaling-server-hpa
  namespace: synthi
  labels:
    app: signaling-server
    app.kubernetes.io/part-of: synthi-ide
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: signaling-server
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
