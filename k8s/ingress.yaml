# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Ingress (GKE + GCP HTTPS Load Balancer)
# ─────────────────────────────────────────────────────────────────────────────
#  Routes external traffic to the correct backend service based on URL path.
#  Uses GKE's built-in Ingress controller (GCE class) which provisions a
#  Google Cloud HTTP(S) Load Balancer automatically.
#
#  Prerequisites:
#    1. A static IP:    gcloud compute addresses create synthi-ip --global
#    2. A managed cert: use the ManagedCertificate below or bring your own.
#    3. DNS:            point synthi.example.com → the static IP.
#
#  WebSocket support:
#    GCE Ingress supports WebSocket natively via BackendConfig timeout.
#    The BackendConfigs below set a 3600s (1h) connection timeout for
#    WebSocket services (signaling, collab, gateway).
# ─────────────────────────────────────────────────────────────────────────────

# ── GCP Managed Certificate ─────────────────────────────────────────────────
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: synthi-cert
  namespace: synthi
spec:
  domains:
    - beta.synthi.app   # TODO: replace with your domain

# ── BackendConfigs (WebSocket timeout) ───────────────────────────────────────
# GCE default timeout is 30s which kills WebSocket connections.
# These BackendConfigs are referenced by annotations on each Service.
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: ws-backend-config
  namespace: synthi
spec:
  timeoutSec: 3600           # 1 hour — keeps WS connections alive
  connectionDraining:
    drainingTimeoutSec: 60
  iap:
    enabled: true
    oauthclientCredentials:
      secretName: iap-oauth-secret

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: http-backend-config
  namespace: synthi
spec:
  timeoutSec: 300             # 5 min — generous for SSR / API routes
  connectionDraining:
    drainingTimeoutSec: 30
  iap:
    enabled: true
    oauthclientCredentials:
      secretName: iap-oauth-secret

---
# ── FrontendConfig (HTTP → HTTPS 301 redirect) ────────────────────────────
# Instead of blocking HTTP entirely (allow-http: "false"), this issues a
# proper 301 redirect so browsers and crawlers follow HTTPS correctly.
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: synthi-frontend-config
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT

# ── Ingress ──────────────────────────────────────────────────────────────────
# NOTE: BackendConfig annotations are defined on the Services in their own
# manifests (frontend.yaml, collab-server.yaml, signaling-server.yaml,
# ai-gateway.yaml) — NOT duplicated here.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synthi-ingress
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "synthi-ip"
    networking.gke.io/managed-certificates: "synthi-cert"
    # Allow HTTP so FrontendConfig can issue 301 redirect to HTTPS
    kubernetes.io/ingress.allow-http: "true"
    networking.gke.io/v1beta1.FrontendConfig: "synthi-frontend-config"
spec:
  rules:
    - host: beta.synthi.app   # TODO: replace with your domain
      http:
        paths:
          # ── Frontend (default) ────────────────────────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

          # ── Collab server (WebSocket + HTTP) ──────────────────────────────
          - path: /collab
            pathType: Prefix
            backend:
              service:
                name: collab-server
                port:
                  number: 1234

          # ── Y-Sweet (CRDT WebSocket relay) ────────────────────────────────
          - path: /ysweet
            pathType: Prefix
            backend:
              service:
                name: y-sweet
                port:
                  number: 8080

          # ── Signaling (WebSocket) ─────────────────────────────────────────
          - path: /signal
            pathType: Prefix
            backend:
              service:
                name: signaling-server
                port:
                  number: 9000

          # ── AI Gateway (WebSocket) ────────────────────────────────────────
          - path: /gateway
            pathType: Prefix
            backend:
              service:
                name: ai-gateway
                port:
                  number: 7070
