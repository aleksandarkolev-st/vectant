# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Ingress (GKE + GCP HTTPS Load Balancer)
# ─────────────────────────────────────────────────────────────────────────────
#  Routes external traffic to the correct backend service based on URL path.
#  Uses GKE's built-in Ingress controller (GCE class) which provisions a
#  Google Cloud HTTP(S) Load Balancer automatically.
#
#  Prerequisites:
#    1. A static IP:    gcloud compute addresses create synthi-ip --global
#    2. A managed cert: use the ManagedCertificate below or bring your own.
#    3. DNS:            point synthi.example.com → the static IP.
#
#  WebSocket support:
#    GCE Ingress supports WebSocket natively via BackendConfig timeout.
#    The BackendConfigs below set a 3600s (1h) connection timeout for
#    WebSocket services (signaling, collab, gateway).
# ─────────────────────────────────────────────────────────────────────────────

# ── GCP Managed Certificate ─────────────────────────────────────────────────
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: synthi-cert
  namespace: synthi
spec:
  domains:
    - synthi.example.com   # TODO: replace with your domain

# ── BackendConfigs (WebSocket timeout) ───────────────────────────────────────
# GCE default timeout is 30s which kills WebSocket connections.
# These BackendConfigs are referenced by annotations on each Service.
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: ws-backend-config
  namespace: synthi
spec:
  timeoutSec: 3600           # 1 hour — keeps WS connections alive
  connectionDraining:
    drainingTimeoutSec: 60

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: http-backend-config
  namespace: synthi
spec:
  timeoutSec: 300             # 5 min — generous for SSR / API routes
  connectionDraining:
    drainingTimeoutSec: 30

# ── Service annotations for BackendConfig binding ────────────────────────────
# These patch the existing Services to reference the BackendConfigs above.
# Apply AFTER the base service manifests.
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: synthi
  labels:
    app: frontend
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    cloud.google.com/backend-config: '{"default": "http-backend-config"}'
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: collab-server
  namespace: synthi
  labels:
    app: collab-server
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    cloud.google.com/backend-config: '{"default": "ws-backend-config"}'
spec:
  selector:
    app: collab-server
  ports:
    - port: 1234
      targetPort: 1234
      name: http-ws
---
apiVersion: v1
kind: Service
metadata:
  name: signaling-server
  namespace: synthi
  labels:
    app: signaling-server
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    cloud.google.com/backend-config: '{"default": "ws-backend-config"}'
spec:
  selector:
    app: signaling-server
  ports:
    - port: 9000
      targetPort: 9000
      name: ws
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: synthi
  labels:
    app: ai-gateway
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    cloud.google.com/backend-config: '{"default": "ws-backend-config"}'
spec:
  selector:
    app: ai-gateway
  ports:
    - port: 7070
      targetPort: 7070
      name: ws

# ── Ingress ──────────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synthi-ingress
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "synthi-ip"
    networking.gke.io/managed-certificates: "synthi-cert"
    # Redirect HTTP → HTTPS
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - host: synthi.example.com   # TODO: replace with your domain
      http:
        paths:
          # ── Frontend (default) ────────────────────────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

          # ── Collab server (WebSocket + HTTP) ──────────────────────────────
          - path: /collab
            pathType: Prefix
            backend:
              service:
                name: collab-server
                port:
                  number: 1234

          # ── Y-Sweet (CRDT WebSocket relay) ────────────────────────────────
          - path: /ysweet
            pathType: Prefix
            backend:
              service:
                name: y-sweet
                port:
                  number: 8080

          # ── Signaling (WebSocket) ─────────────────────────────────────────
          - path: /signal
            pathType: Prefix
            backend:
              service:
                name: signaling-server
                port:
                  number: 9000

          # ── AI Gateway (WebSocket) ────────────────────────────────────────
          - path: /gateway
            pathType: Prefix
            backend:
              service:
                name: ai-gateway
                port:
                  number: 7070
