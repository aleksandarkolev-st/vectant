apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: synthi-managed-cert
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  domains:
    - beta.vectant.dev
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: synthi-frontend-config
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: frontend-backend-config
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  timeoutSec: 300
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /api/auth/providers
    port: 3000
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: collab-backend-config
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 1234
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gateway-backend-config
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /gateway/health
    port: 7070
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: signaling-backend-config
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /
    port: 8080
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synthi-ingress
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "true"
    kubernetes.io/ingress.global-static-ip-name: synthi-ip
    networking.gke.io/managed-certificates: synthi-managed-cert
    networking.gke.io/v1beta1.FrontendConfig: synthi-frontend-config
spec:
  defaultBackend:
    service:
      name: frontend
      port:
        number: 3000
  rules:
    - host: beta.vectant.dev
      http:
        paths:
          - path: /collab
            pathType: Prefix
            backend:
              service:
                name: collab-server
                port:
                  number: 1234
          - path: /signal
            pathType: Prefix
            backend:
              service:
                name: signaling-server
                port:
                  number: 9000
          - path: /gateway
            pathType: Prefix
            backend:
              service:
                name: ai-gateway
                port:
                  number: 7070
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
