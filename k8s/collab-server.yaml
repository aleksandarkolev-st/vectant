# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Collab Server (Node.js, REST + WS notifications)
# ─────────────────────────────────────────────────────────────────────────────
#  Handles:
#    - HTTP API (file hashes, git, workspaces, TURN credentials, Y-Sweet tokens)
#    - Notification / session / terminal WebSockets
#    - GCS ↔ disk sync
#
#  CRDT document editing is handled by Y-Sweet (see y-sweet.yaml).
#  This server is stateless for CRDT — uses a PVC only for ephemeral
#  repo cache.  Safe to run multiple replicas behind a load balancer
#  once repos are sharded or shared via NFS/GCS.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-server
  namespace: synthi
  labels:
    app: collab-server
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: synthi-ide
spec:
  replicas: 1    # Safe to scale once repos are sharded / shared
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: collab-server
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: synthi-ide
  template:
    metadata:
      labels:
        app: collab-server
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: synthi-ide
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      serviceAccountName: collab-server-sa
      containers:
        - name: collab
          image: europe-west10-docker.pkg.dev/vectant-proj/synthi/synthi-collab-server:build-tag-required
          ports:
            - containerPort: 1235
              name: app
          env:
            # ── Networking ──────────────────────────────────────────────────
            - name: COLLAB_PORT
              value: "1235"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=2048"
            - name: SYNTHI_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_PUBLIC_APP_URL
            - name: SYNTHI_APP_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_APP_INTERNAL_URL
            - name: SYNTHI_PREVIEW_TARGET_TEMPLATE
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_PREVIEW_TARGET_TEMPLATE
            - name: SYNTHI_PREVIEW_PUBLIC_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_PREVIEW_PUBLIC_PREFIX
            - name: SYNTHI_PREVIEW_SIDECAR_PORT
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_PREVIEW_SIDECAR_PORT
            - name: SYNTHI_PREVIEW_SIDECAR_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_PREVIEW_SIDECAR_PREFIX
            - name: SYNTHI_PREVIEW_SIDECAR_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_PREVIEW_SIDECAR_IMAGE
            - name: SYNTHI_BROWSER_WORKFLOW_BRIDGE_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_BROWSER_WORKFLOW_BRIDGE_IMAGE
            - name: SYNTHI_BROWSER_WORKFLOW_BRIDGE_PORT
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_BROWSER_WORKFLOW_BRIDGE_PORT
            - name: SYNTHI_HOSTED_BROWSER_CDP_PORT
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_HOSTED_BROWSER_CDP_PORT
            - name: SYNTHI_PREVIEW_SCAN_PORTS
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_PREVIEW_SCAN_PORTS
            - name: SYNTHI_TERMINAL_PORT_POOL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_TERMINAL_PORT_POOL
            - name: SYNTHI_TERMINAL_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_TERMINAL_BACKEND
            - name: SYNTHI_NO_JAIL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_NO_JAIL
            - name: SYNTHI_TERMINAL_SCOPE_PORTS
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_TERMINAL_SCOPE_PORTS
            - name: SYNTHI_PREVIEW_BIND_HOST
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_PREVIEW_BIND_HOST
            - name: WORKSPACE_DATA_PVC
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_DATA_PVC
            - name: WORKSPACE_DATA_MOUNT
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_DATA_MOUNT
            - name: WORKSPACE_REPOS_PATH
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_REPOS_PATH
            - name: WORKSPACE_PREP_PVC_NAME
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_DATA_PVC
            - name: WORKSPACE_PREP_MOUNT_PATH
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_DATA_MOUNT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: CORS_ORIGIN
            - name: CODE_INTEL_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: CODE_INTEL_URL
            - name: AI_BACKEND_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: AI_BACKEND_AUTH_TOKEN
            - name: SYNTHI_RUNTIME_ID_SECRET
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: SYNTHI_RUNTIME_ID_SECRET
            - name: SYNTHI_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: SYNTHI_TOKEN_ENCRYPTION_KEY
            # ── Y-Sweet CRDT server ──────────────────────────────────────
            - name: YSWEET_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: YSWEET_URL
            - name: YSWEET_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: YSWEET_AUTH_KEY
                  optional: true
            # ── Persistence (repo cache only — no LevelDB) ──────────────────
            - name: REPOS_DIR
              value: /data/repos
            - name: REPO_CACHE_DIR
              value: /data/repos
            # ── GCS ─────────────────────────────────────────────────────────
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: GCP_PROJECT_ID
            - name: GCS_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: GCS_BUCKET_NAME
            - name: GCS_WORKSPACE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: GCS_WORKSPACE_PREFIX
            # ── Feature flags ───────────────────────────────────────────────
            - name: GCS_SYNC_ON_FLUSH
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: GCS_SYNC_ON_FLUSH
            - name: CODE_INTEL_AUTO_INDEX
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: CODE_INTEL_AUTO_INDEX
            - name: FLUSH_DEBOUNCE_MS
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: FLUSH_DEBOUNCE_MS
            # ── TURN credentials ────────────────────────────────────────────
            - name: CLOUDFLARE_TURN_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: CLOUDFLARE_TURN_TOKEN_ID
            - name: CLOUDFLARE_TURN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: CLOUDFLARE_TURN_API_TOKEN
            - name: TURN_CREDENTIAL_TTL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: TURN_CREDENTIAL_TTL
            # ── Workspace pod spawner ───────────────────────────────────────
            - name: K8S_NAMESPACE
              value: synthi
            - name: WORKER_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKER_IMAGE
            - name: WORKSPACE_NODE_SELECTOR_KEY
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_NODE_SELECTOR_KEY
            - name: WORKSPACE_NODE_SELECTOR_VALUE
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_NODE_SELECTOR_VALUE
            - name: WORKSPACE_NODE_TAINT_KEY
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_NODE_TAINT_KEY
            - name: WORKSPACE_NODE_TAINT_VALUE
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_NODE_TAINT_VALUE
            - name: WORKSPACE_NODE_TAINT_EFFECT
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: WORKSPACE_NODE_TAINT_EFFECT
            - name: IDLE_TIMEOUT_MS
              value: "300000"   # 5 min
            - name: MAX_WORKSPACE_PODS
              value: "10"
            - name: POD_READY_TIMEOUT_MS
              value: "300000"   # 5 min
            - name: SPAWNER_CLEANUP_ON_SHUTDOWN
              value: "false"
            - name: REDIS_URL
              value: redis://redis.synthi.svc.cluster.local:6379
          volumeMounts:
            - name: collab-data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /debug/status
              port: 1235
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /debug/status
              port: 1235
            initialDelaySeconds: 10
            periodSeconds: 20
        - name: edge-proxy
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat <<'EOF' >/etc/nginx/nginx.conf
              worker_processes auto;
              events {}
              http {
                map $http_upgrade $connection_upgrade {
                  default upgrade;
                  '' close;
                }
                server {
                  listen 1234;
                  location = /healthz {
                    add_header Content-Type text/plain;
                    return 200 'ok';
                  }
                  location / {
                    proxy_pass http://127.0.0.1:1235;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection $connection_upgrade;
                    proxy_read_timeout 3600s;
                    proxy_send_timeout 3600s;
                  }
                }
              }
              EOF
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 1234
              name: http-ws
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 1234
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 1234
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: collab-data
          persistentVolumeClaim:
            claimName: collab-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: collab-data-pvc
  namespace: synthi
  labels:
    app: collab-server
    app.kubernetes.io/part-of: synthi-ide
spec:
  # Runtime pods and the collab server both mount /data/repos. In GKE this
  # must be RWX storage when pods can schedule on different node pools.
  # Closed beta uses standard-rwx because this project has no enterprise
  # multishare quota in europe-west10.
  storageClassName: standard-rwx
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Gi    # shared runtime filesystem pool for closed beta
---
apiVersion: v1
kind: Service
metadata:
  name: collab-server
  namespace: synthi
  labels:
    app: collab-server
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    cloud.google.com/backend-config: '{"ports":{"1234":"collab-backend-config"}}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  selector:
    app: collab-server
  ports:
    - port: 1234
      targetPort: 1234
      name: http-ws
