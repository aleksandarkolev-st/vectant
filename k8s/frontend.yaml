# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Next.js Frontend
# ─────────────────────────────────────────────────────────────────────────────
#  The Next.js app serves both the static client bundle and the API routes
#  (auth, TURN credentials, workspace CRUD).
#
#  IMPORTANT: NEXT_PUBLIC_* env vars are baked into the client bundle at
#  `next build` time.  They must be set in the Dockerfile / CI build step,
#  NOT just at runtime.  The runtime env vars below (AUTH_SECRET, DATABASE_URL
#  etc.) are read server-side by API routes and work normally.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: synthi
  labels:
    app: frontend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: synthi-ide
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: synthi-ide
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: synthi-ide
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      serviceAccountName: frontend-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: frontend
                    app.kubernetes.io/managed-by: kustomize
                    app.kubernetes.io/part-of: synthi-ide
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nextjs
          image: europe-west10-docker.pkg.dev/vectant-proj/synthi/synthi-frontend:build-tag-required
          ports:
            - containerPort: 3000
              name: http
          env:
            # ── Auth ────────────────────────────────────────────────────────
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: AUTH_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: NEXTAUTH_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: GITHUB_ID
            - name: GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: GITHUB_SECRET
            # ── Database (Prisma) ───────────────────────────────────────────
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: DATABASE_URL
            # ── Internal service URLs for Next.js API routes ───────────────
            - name: COLLAB_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: COLLAB_SERVER_URL
            - name: CODE_INTEL_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: CODE_INTEL_URL
            - name: AI_ENGINE_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: CODE_INTEL_URL
            - name: AI_BACKEND_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: AI_BACKEND_AUTH_TOKEN
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: GCP_PROJECT_ID
            - name: GCS_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: GCS_BUCKET_NAME
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: GEMINI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: SYNTHI_BROWSER_WORKFLOW_BRIDGE_URL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: SYNTHI_BROWSER_WORKFLOW_BRIDGE_URL
            - name: SYNTHI_BROWSER_WORKFLOW_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: SYNTHI_BROWSER_WORKFLOW_BRIDGE_TOKEN
                  optional: true
            # ── TURN credentials (server-side API route) ────────────────────
            - name: CLOUDFLARE_TURN_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: CLOUDFLARE_TURN_TOKEN_ID
            - name: CLOUDFLARE_TURN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: CLOUDFLARE_TURN_API_TOKEN
            - name: TURN_CREDENTIAL_TTL
              valueFrom:
                configMapKeyRef:
                  name: synthi-config
                  key: TURN_CREDENTIAL_TTL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/auth/providers
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/auth/providers
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: synthi
  labels:
    app: frontend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    cloud.google.com/backend-config: '{"ports":{"3000":"frontend-backend-config"}}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
