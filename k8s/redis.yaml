# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Redis (signaling Pub/Sub)
# ─────────────────────────────────────────────────────────────────────────────
#  Lightweight Redis used by the signaling server for cross-pod session relay.
#  No persistence needed — signaling state is ephemeral.
#
#  For production at scale, consider Memorystore for Redis (GCP managed).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: synthi
  labels:
    app: redis
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: synthi-ide
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: synthi-ide
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: synthi-ide
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      containers:
        - name: redis
          image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          args: ["--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: synthi
  labels:
    app: redis
    app.kubernetes.io/part-of: synthi-ide
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
