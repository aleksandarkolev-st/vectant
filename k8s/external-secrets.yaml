# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — External Secrets (GCP Secret Manager → K8s Secrets)
# ─────────────────────────────────────────────────────────────────────────────
#  Prerequisites:
#    1. External Secrets Operator installed:
#         helm repo add external-secrets https://charts.external-secrets.io
#         helm install external-secrets external-secrets/external-secrets \
#           --namespace external-secrets --create-namespace --set installCRDs=true
#    2. GCP Secret Manager secrets created (see create-gcp-secrets.sh)
#    3. Workload Identity binding (see workload-identity-setup.sh)
#
#  This REPLACES the manual k8s/secrets.yaml with auto-synced secrets.
#  The target Secret name (synthi-secrets) matches all existing secretKeyRef
#  references — zero changes needed in deployment manifests.
# ─────────────────────────────────────────────────────────────────────────────

# ── K8s ServiceAccount for ESO (Workload Identity annotated) ───────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-service-account
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
  annotations:
    iam.gke.io/gcp-service-account: synthi-eso-sa@vectant-proj.iam.gserviceaccount.com

---
# ── SecretStore (namespace-scoped, GCP Secret Manager via Workload Identity) ─
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  provider:
    gcpsm:
      projectID: vectant-proj
      auth:
        workloadIdentity:
          clusterLocation: europe-west10-a
          clusterName: synthi-beta-cluster
          clusterProjectID: vectant-proj
          serviceAccountRef:
            name: eso-service-account

---
# ── ExternalSecret (syncs GCP Secret Manager → synthi-secrets K8s Secret) ──
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: synthi-secrets
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: synthi-secrets          # Must match existing secretKeyRef references
    creationPolicy: Orphan        # Create or update without taking over manual Secret ownership
    deletionPolicy: Retain        # Keep K8s Secret if ExternalSecret is removed
  data:
    # ── PostgreSQL ──────────────────────────────────────────────────────────
    - secretKey: DATABASE_URL
      remoteRef:
        key: synthi-database-url
    - secretKey: POSTGRES_USER
      remoteRef:
        key: synthi-postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: synthi-postgres-password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: synthi-postgres-db

    # ── NextAuth / OAuth ────────────────────────────────────────────────────
    - secretKey: AUTH_SECRET
      remoteRef:
        key: synthi-auth-secret
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: synthi-nextauth-secret
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: synthi-google-client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: synthi-google-client-secret
    - secretKey: GITHUB_ID
      remoteRef:
        key: synthi-github-id
    - secretKey: GITHUB_SECRET
      remoteRef:
        key: synthi-github-secret

    # ── AI Provider Keys ────────────────────────────────────────────────────
    - secretKey: AI_BACKEND_AUTH_TOKEN
      remoteRef:
        key: synthi-ai-backend-auth-token
    - secretKey: SYNTHI_RUNTIME_ID_SECRET
      remoteRef:
        key: synthi-runtime-id-secret
    - secretKey: SYNTHI_TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: synthi-token-encryption-key
    - secretKey: SYNTHI_BROWSER_WORKFLOW_BRIDGE_TOKEN
      remoteRef:
        key: synthi-browser-workflow-bridge-token
    - secretKey: SYNTHI_PRIVATE_WORKFLOW_TOOL_STORE_KEY
      remoteRef:
        key: synthi-private-workflow-tool-store-key
    - secretKey: SYNTHI_AUTH_CHECKPOINT_STORE_KEY
      remoteRef:
        key: synthi-auth-checkpoint-store-key
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: synthi-gemini-api-key

    # ── Y-Sweet Auth ────────────────────────────────────────────────────────
    - secretKey: YSWEET_AUTH_KEY
      remoteRef:
        key: synthi-ysweet-auth-key

    # ── CodeSite ────────────────────────────────────────────────────────────
    # Shared internal-service token. The frontend validates it, the collab-server
    # presents it when consulting the CodeSite control plane. Both sides read the
    # same variable; without it the collab-server calls the control plane
    # unauthenticated and every CodeSite-gated mutation is refused.
    - secretKey: SYNTHI_CODESITE_TOKEN
      remoteRef:
        key: synthi-codesite-token
    # Separate trust boundary for authenticated frontend -> collab-server
    # transaction activity publishes. Do not reuse synthi-codesite-token.
    - secretKey: COLLAB_INTERNAL_TOKEN
      remoteRef:
        key: synthi-collab-internal-token
