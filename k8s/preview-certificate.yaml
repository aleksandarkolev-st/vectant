apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-preview-dns
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  acme:
    email: aleksandar.kolev@vectant.dev
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-preview-dns-account-key
    solvers:
      - selector:
          dnsZones:
            - preview.vectant.dev
        dns01:
          cloudDNS:
            project: vectant-proj
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: preview-wildcard-cert
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  secretName: preview-wildcard-tls
  issuerRef:
    name: letsencrypt-preview-dns
    kind: ClusterIssuer
  dnsNames:
    - preview.vectant.dev
    - "*.preview.vectant.dev"
