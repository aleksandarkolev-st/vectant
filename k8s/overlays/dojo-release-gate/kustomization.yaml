apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Opt-in overlay for Agent Dojo enterprise release-gate candidates.
# The default k8s/ base remains beta-compatible and is not changed by this
# overlay unless Cloud Build or an operator explicitly renders this directory.
namespace: synthi

resources:
  - ../../namespace.yaml
  - ../../configmap.yaml
  - ../../spawner-rbac.yaml
  - ../../ai-engine.yaml
  - ../../ai-gateway.yaml
  - ../../y-sweet.yaml
  - ../../collab-server.yaml
  - ../../signaling-server.yaml
  - ../../frontend.yaml
  - ../../worker.yaml
  - ../../preview-certificate.yaml
  - ../../ingress.yaml
  - ../../network-policies.yaml
  - ../../pod-disruption-budgets.yaml
  - ../../external-secrets.yaml
  - dojo-release-external-secrets.yaml
  - dojo-mcp-host.yaml

patches:
  - path: dojo-release-config.yaml
  - target:
      kind: Ingress
      name: synthi-ingress
    patch: |-
      - op: add
        path: /spec/rules/0/http/paths/0
        value:
          path: /dojo/mcp
          pathType: Prefix
          backend:
            service:
              name: dojo-mcp-host
              port:
                number: 9467
  - target:
      kind: ConfigMap
      name: synthi-config
    patch: |-
      - op: remove
        path: /data/REDIS_URL
  - target:
      kind: Deployment
      name: collab-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/66
        value:
          name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: synthi-secrets
              key: REDIS_URL
  - target:
      kind: Deployment
      name: signaling-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1
        value:
          name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: synthi-secrets
              key: REDIS_URL

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: synthi-ide
