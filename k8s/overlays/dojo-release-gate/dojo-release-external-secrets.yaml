apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: synthi-dojo-release-secrets
  namespace: synthi
  labels:
    app.kubernetes.io/part-of: synthi-ide
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: synthi-dojo-release-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: synthi-redis-url
    - secretKey: SYNTHI_DOJO_CONTROL_PLANE_POSTGRES_URL
      remoteRef:
        key: synthi-dojo-control-plane-postgres-url
    - secretKey: SYNTHI_DOJO_EVIDENCE_LEDGER_POSTGRES_URL
      remoteRef:
        key: synthi-dojo-evidence-ledger-postgres-url
    - secretKey: SYNTHI_DOJO_PROOF_SIGNING_KEY_ID
      remoteRef:
        key: synthi-dojo-proof-signing-key-id
    - secretKey: SYNTHI_DOJO_PROOF_SIGNING_COMMAND
      remoteRef:
        key: synthi-dojo-proof-signing-command
    - secretKey: SYNTHI_DOJO_PROOF_SIGNING_COMMAND_ARGS
      remoteRef:
        key: synthi-dojo-proof-signing-command-args
    - secretKey: SYNTHI_DOJO_PROOF_SIGNING_MANAGED_KEY_URI
      remoteRef:
        key: synthi-dojo-proof-signing-managed-key-uri
    - secretKey: SYNTHI_DOJO_PROOF_SIGNING_PUBLIC_KEY_PEM
      remoteRef:
        key: synthi-dojo-proof-signing-public-key-pem
    - secretKey: SYNTHI_DOJO_MCP_MANIFEST_KEY_ID
      remoteRef:
        key: synthi-dojo-mcp-manifest-key-id
    - secretKey: SYNTHI_DOJO_MCP_MANIFEST_PRIVATE_KEY_PEM
      remoteRef:
        key: synthi-dojo-mcp-manifest-private-key-pem
    - secretKey: SYNTHI_DOJO_MCP_MANIFEST_PUBLIC_KEY_PEM
      remoteRef:
        key: synthi-dojo-mcp-manifest-public-key-pem
    - secretKey: SYNTHI_DOJO_MCP_BEARER_TOKEN
      remoteRef:
        key: synthi-dojo-mcp-bearer-token
    # The 16 SYNTHI_THERAPEUTIC_PROD_* entries that were here are removed until
    # their secrets exist. They were wired in on 2026-07-01 (a6eefa6aa) but no
    # synthi-therapeutic-prod-* secret was ever created in vectant-proj, so
    # External Secrets could not sync this ExternalSecret at all: it reported
    # SecretSyncedError ("Secret does not exist") and the whole deploy blocked
    # on `timed out waiting for the condition on
    # externalsecrets/synthi-dojo-release-secrets` -- taking every unrelated
    # service down with it. Build 41bc0262/d53d7cd2 failed exactly here.
    #
    # The feature is flag-gated by SYNTHI_THERAPEUTIC_PROD_ENDPOINTS_ENABLED,
    # now "0" in dojo-release-config.yaml. To restore: create the 16 secrets in
    # Secret Manager, re-add these entries, and set the flag back to "1".
    - secretKey: SYNTHI_HOSTED_BROWSER_CDP_URL
      remoteRef:
        key: synthi-dojo-hosted-browser-cdp-url
    - secretKey: SYNTHI_HOSTED_BROWSER_WORKSPACE_URL
      remoteRef:
        key: synthi-dojo-hosted-browser-workspace-url
    - secretKey: SYNTHI_WORKSPACE_ID
      remoteRef:
        key: synthi-dojo-release-workspace-id
    - secretKey: SYNTHI_AGENT_ID
      remoteRef:
        key: synthi-dojo-release-agent-id
    - secretKey: SYNTHI_PRIVATE_WORKFLOW_TOOL_STORE_FILE
      remoteRef:
        key: synthi-private-workflow-tool-store-file
    - secretKey: SYNTHI_PRIVATE_WORKFLOW_TOOL_SCOPE
      remoteRef:
        key: synthi-private-workflow-tool-scope
    - secretKey: SYNTHI_PRIVATE_WORKFLOW_TOOL_STORE_KEY
      remoteRef:
        key: synthi-private-workflow-tool-store-key
    - secretKey: SYNTHI_AUTH_CHECKPOINT_STORE_FILE
      remoteRef:
        key: synthi-auth-checkpoint-store-file
    - secretKey: SYNTHI_AUTH_CHECKPOINT_SCOPE
      remoteRef:
        key: synthi-auth-checkpoint-scope
    - secretKey: SYNTHI_AUTH_CHECKPOINT_STORE_KEY
      remoteRef:
        key: synthi-auth-checkpoint-store-key
