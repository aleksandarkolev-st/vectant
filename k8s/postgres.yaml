# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — PostgreSQL (StatefulSet + PVC)
# ─────────────────────────────────────────────────────────────────────────────
#  Used by Prisma (NextAuth sessions, workspaces, users).
#
#  For production, consider Cloud SQL with the Cloud SQL Auth Proxy sidecar
#  instead of running Postgres in-cluster. This manifest is suitable for
#  staging / dev environments and small-scale production.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: synthi
  labels:
    app: postgres
    app.kubernetes.io/part-of: synthi-ide
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: synthi-secrets
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "synthi"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "synthi"]
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Uses the GKE default StorageClass (pd-standard).
        # For better IOPS, set storageClassName: premium-rwo
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: synthi
  labels:
    app: postgres
    app.kubernetes.io/part-of: synthi-ide
spec:
  clusterIP: None   # headless for StatefulSet
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
