apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: synthi-frontend
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/vpc-access-connector: synthi-serverless-ew10
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/cloudsql-instances: overview-synti:europe-west10:synthi-dev
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: synthi-frontend-run@overview-synti.iam.gserviceaccount.com
      containers:
        - image: europe-west10-docker.pkg.dev/overview-synti/synthi/synthi-frontend:4e639d76-c12d-43ea-8ce8-177ea87d37a6
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: NEXTAUTH_URL
              value: https://beta.synthi.app
            - name: NEXT_PUBLIC_COLLAB_SERVER_URL
              value: https://beta.synthi.app/collab
            - name: NEXT_PUBLIC_YSWEET_URL
              value: https://beta.synthi.app/ysweet
            - name: NEXT_PUBLIC_GATEWAY_WS_URL
              value: wss://beta.synthi.app/gateway/ws
            - name: NEXT_PUBLIC_CODE_INTEL_URL
              value: https://beta.synthi.app
            - name: NEXT_PUBLIC_AI_ENGINE_URL
              value: https://beta.synthi.app
            - name: COLLAB_SERVER_URL
              value: https://beta.synthi.app/collab
            - name: CODE_INTEL_URL
              value: https://synthi-ai-engine-767721372193.europe-west10.run.app
            - name: AI_ENGINE_URL
              value: https://synthi-ai-engine-767721372193.europe-west10.run.app
            - name: TURN_CREDENTIAL_TTL
              value: "86400"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: AUTH_SECRET
                  key: latest
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: NEXTAUTH_SECRET
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_ID
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_SECRET
                  key: latest
            - name: GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: GITHUB_ID
                  key: latest
            - name: GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: GITHUB_SECRET
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: CLOUDFLARE_TURN_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: CLOUDFLARE_TURN_TOKEN_ID
                  key: latest
            - name: CLOUDFLARE_TURN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: CLOUDFLARE_TURN_API_TOKEN
                  key: latest
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi