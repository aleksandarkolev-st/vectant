apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: synthi-ai-gateway
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "6"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/vpc-access-connector: synthi-serverless-ew10
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 50
      timeoutSeconds: 300
      serviceAccountName: synthi-ai-gateway-run@overview-synti.iam.gserviceaccount.com
      containers:
        - image: europe-west10-docker.pkg.dev/overview-synti/synthi/synthi-ai-gateway:4e639d76-c12d-43ea-8ce8-177ea87d37a6
          ports:
            - name: http1
              containerPort: 7070
          env:
            - name: GATEWAY_PORT
              value: "7070"
            - name: GATEWAY_WS_PATH
              value: /gateway/ws
            - name: GATEWAY_CLUSTER
              value: "false"
            - name: BACKEND_URL
              value: https://synthi-ai-engine-767721372193.europe-west10.run.app
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi