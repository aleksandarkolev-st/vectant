apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: synthi-ai-gateway
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "6"
        run.googleapis.com/ingress: internal-and-cloud-load-balancing
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 50
      timeoutSeconds: 300
      serviceAccountName: synthi-ai-gateway-run@overview-synti.iam.gserviceaccount.com
      containers:
        - image: europe-west10-docker.pkg.dev/overview-synti/synthi/synthi-ai-gateway:latest
          ports:
            - name: http1
              containerPort: 7070
          env:
            - name: GATEWAY_PORT
              value: "7070"
            - name: GATEWAY_WS_PATH
              value: /gateway/ws
            - name: GATEWAY_CLUSTER
              value: "false"
            - name: BACKEND_URL
              value: https://synthi-ai-engine-REPLACE_WITH_HASH-ew.a.run.app
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi