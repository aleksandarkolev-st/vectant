# ─────────────────────────────────────────────────────────────────────────────
#  Synthi IDE — Cloud Build CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
#  Trigger: Push to main branch
#  Steps:  Build (Kaniko, parallel) → Deploy (kubectl)
#
#  Substitutions (override via trigger config or --substitutions):
#    _REGION:       Artifact Registry + GKE region    (default: europe-west10)
#    _GKE_CLUSTER:  GKE cluster name
#    _GKE_ZONE:     GKE cluster zone / location
#
#  Prerequisites:
#    1. Artifact Registry repo:
#         gcloud artifacts repositories create synthi \
#           --repository-format=docker --location=europe-west10
#    2. IAM for Cloud Build service account:
#         roles/artifactregistry.writer
#         roles/container.developer
#         roles/iam.serviceAccountUser
#    3. Cloud Build trigger:
#         gcloud builds triggers create github \
#           --name="synthi-deploy-main" \
#           --repo-name="synthi-ide" --repo-owner="YOUR_ORG" \
#           --branch-pattern="^main$" --build-config="cloudbuild.yaml"
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  _REGION: europe-west10
  _GKE_CLUSTER: synthi-beta-cluster
  _GKE_ZONE: europe-west10-a
  _REGISTRY: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/synthi
  _MANIFEST_SOURCE_REGISTRY: europe-west10-docker.pkg.dev/vectant-proj/synthi
  _IMAGE_TAG: ${BUILD_ID}
  _KUSTOMIZE_DIR: k8s
  _KUSTOMIZE_LOAD_RESTRICTOR: ""
  _DOJO_RELEASE_KUSTOMIZE_DIR: k8s/overlays/dojo-release-gate

  # NEXT_PUBLIC_* build args baked into the frontend client bundle.
  # Override these per environment via trigger substitutions.
  _NEXT_PUBLIC_COLLAB_SERVER_URL: "https://beta.vectant.dev/collab"
  _NEXT_PUBLIC_YSWEET_URL: "https://beta.vectant.dev/collab"
  _NEXT_PUBLIC_COLLAB_PORT: "443"
  _NEXT_PUBLIC_COMPILE_SIGNAL_URL: "wss://beta.vectant.dev/signal"
  _NEXT_PUBLIC_GATEWAY_WS_URL: "wss://beta.vectant.dev/gateway/ws"
  _NEXT_PUBLIC_CODE_INTEL_URL: "https://beta.vectant.dev"
  _NEXT_PUBLIC_AI_ENGINE_URL: "https://beta.vectant.dev"
  _NEXT_PUBLIC_ENABLE_WORKSPACE_SPAWNER: "true"
  _NEXT_PUBLIC_SYNTHI_LOOPBACK_AUTH_BRIDGE_PATH: "/auth/loopback"
  _WORKER_INSTALL_ROCM: "false"
  _ENABLE_VULNERABILITY_SCAN: "false"

options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: "200"
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

tags:
  - synthi-ide
  - main-deploy

steps:
  - id: reject-mutable-images
    waitFor: ['-']
    name: gcr.io/cloud-builders/gcloud:latest@sha256:46e6289806bc317cb06c2476ee53631d3e0046edb6743ef4486fd38f13f5ff93
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if grep -RInE '(^[[:space:]]*(FROM|image:|name:)|--destination=).*:latest([^@]|$)' \
          --include='Dockerfile*' --include='*.yaml' --include='*.yml' \
          --exclude='*.backup' --exclude='cloudbuild.yaml' .; then
          echo "Mutable :latest image references must be pinned by digest or replaced with an immutable build tag." >&2
          exit 1
        fi

  # ───────────────────────────────────────────────────────────────────────────
  # BUILD — Service images in parallel via Kaniko (layer-cached)
  # ───────────────────────────────────────────────────────────────────────────

  # ── 0. Prepare Next.js environment ───────────────────────────────────────
  - id: prepare-frontend-env
    waitFor: ['reject-mutable-images']
    name: 'ubuntu:25.10@sha256:4a9232cc47bf99defcc8860ef6222c99773330367fcecbf21ba2edb0b810a31e'
    entrypoint: 'bash'
    env:
      - 'NEXT_PUBLIC_COLLAB_SERVER_URL=${_NEXT_PUBLIC_COLLAB_SERVER_URL}'
      - 'NEXT_PUBLIC_YSWEET_URL=${_NEXT_PUBLIC_YSWEET_URL}'
      - 'NEXT_PUBLIC_COLLAB_PORT=${_NEXT_PUBLIC_COLLAB_PORT}'
      - 'NEXT_PUBLIC_COMPILE_SIGNAL_URL=${_NEXT_PUBLIC_COMPILE_SIGNAL_URL}'
      - 'NEXT_PUBLIC_GATEWAY_WS_URL=${_NEXT_PUBLIC_GATEWAY_WS_URL}'
      - 'NEXT_PUBLIC_CODE_INTEL_URL=${_NEXT_PUBLIC_CODE_INTEL_URL}'
      - 'NEXT_PUBLIC_AI_ENGINE_URL=${_NEXT_PUBLIC_AI_ENGINE_URL}'
      - 'NEXT_PUBLIC_ENABLE_WORKSPACE_SPAWNER=${_NEXT_PUBLIC_ENABLE_WORKSPACE_SPAWNER}'
      - 'NEXT_PUBLIC_SYNTHI_LOOPBACK_AUTH_BRIDGE_PATH=${_NEXT_PUBLIC_SYNTHI_LOOPBACK_AUTH_BRIDGE_PATH}'
    args:
      - '-c'
      - |
        cat <<EOF > synthi/.env.production
        NEXT_PUBLIC_COLLAB_SERVER_URL=$$NEXT_PUBLIC_COLLAB_SERVER_URL
        NEXT_PUBLIC_YSWEET_URL=$$NEXT_PUBLIC_YSWEET_URL
        NEXT_PUBLIC_COLLAB_PORT=$$NEXT_PUBLIC_COLLAB_PORT
        NEXT_PUBLIC_COMPILE_SIGNAL_URL=$$NEXT_PUBLIC_COMPILE_SIGNAL_URL
        NEXT_PUBLIC_GATEWAY_WS_URL=$$NEXT_PUBLIC_GATEWAY_WS_URL
        NEXT_PUBLIC_CODE_INTEL_URL=$$NEXT_PUBLIC_CODE_INTEL_URL
        NEXT_PUBLIC_AI_ENGINE_URL=$$NEXT_PUBLIC_AI_ENGINE_URL
        NEXT_PUBLIC_ENABLE_WORKSPACE_SPAWNER=$$NEXT_PUBLIC_ENABLE_WORKSPACE_SPAWNER
        NEXT_PUBLIC_SYNTHI_LOOPBACK_AUTH_BRIDGE_PATH=$$NEXT_PUBLIC_SYNTHI_LOOPBACK_AUTH_BRIDGE_PATH
        EOF

  # ── 1. Frontend (Next.js) ────────────────────────────────────────────────
  - id: build-frontend
    waitFor: ['prepare-frontend-env']
    name: gcr.io/kaniko-project/executor:latest@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=synthi/Dockerfile
      # Root context: synthi is an npm workspace that depends on packages/mcp-hub,
      # so the frontend image builds from the repo root (matches docker-compose).
      - --context=dir:///workspace
      - --destination=${_REGISTRY}/synthi-frontend:${_IMAGE_TAG}
      - --build-arg=NEXT_PUBLIC_COLLAB_SERVER_URL=${_NEXT_PUBLIC_COLLAB_SERVER_URL}
      - --build-arg=NEXT_PUBLIC_YSWEET_URL=${_NEXT_PUBLIC_YSWEET_URL}
      - --build-arg=NEXT_PUBLIC_COLLAB_PORT=${_NEXT_PUBLIC_COLLAB_PORT}
      - --build-arg=NEXT_PUBLIC_COMPILE_SIGNAL_URL=${_NEXT_PUBLIC_COMPILE_SIGNAL_URL}
      - --build-arg=NEXT_PUBLIC_GATEWAY_WS_URL=${_NEXT_PUBLIC_GATEWAY_WS_URL}
      - --build-arg=NEXT_PUBLIC_CODE_INTEL_URL=${_NEXT_PUBLIC_CODE_INTEL_URL}
      - --build-arg=NEXT_PUBLIC_AI_ENGINE_URL=${_NEXT_PUBLIC_AI_ENGINE_URL}
      - --build-arg=NEXT_PUBLIC_ENABLE_WORKSPACE_SPAWNER=${_NEXT_PUBLIC_ENABLE_WORKSPACE_SPAWNER}
      - --build-arg=NEXT_PUBLIC_SYNTHI_LOOPBACK_AUTH_BRIDGE_PATH=${_NEXT_PUBLIC_SYNTHI_LOOPBACK_AUTH_BRIDGE_PATH}
      - --cache=true
      - --cache-ttl=168h

  # ── 2. Collab Server (Node.js) ──────────────────────────────────────────
  - id: build-collab-server
    waitFor: ['reject-mutable-images']
    name: gcr.io/kaniko-project/executor:latest@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=backend/collab-server/Dockerfile
      - --context=dir:///workspace/backend/collab-server
      - --destination=${_REGISTRY}/synthi-collab-server:${_IMAGE_TAG}
      - --cache=true
      - --cache-ttl=168h

  # ── 3. AI Engine (Python FastAPI) ───────────────────────────────────────
  - id: build-ai-engine
    waitFor: ['reject-mutable-images']
    name: gcr.io/kaniko-project/executor:latest@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=ai-backend/ai-engine/Dockerfile
      - --context=dir:///workspace/ai-backend/ai-engine
      - --destination=${_REGISTRY}/synthi-ai-engine:${_IMAGE_TAG}
      - --cache=true
      - --cache-ttl=168h

  # ── 4. AI Gateway (Node.js WS proxy) ───────────────────────────────────
  - id: build-ai-gateway
    waitFor: ['reject-mutable-images']
    name: gcr.io/kaniko-project/executor:latest@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=ai-backend/gateway/Dockerfile
      - --context=dir:///workspace/ai-backend/gateway
      - --destination=${_REGISTRY}/synthi-ai-gateway:${_IMAGE_TAG}
      - --cache=true
      - --cache-ttl=168h

  # ── 5. Signaling Server (Rust) ─────────────────────────────────────────
  - id: build-signaling
    waitFor: ['build-frontend']
    name: gcr.io/kaniko-project/executor:latest@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=backend/synthi-webrtc-compiler/signaling-server/Dockerfile
      - --context=dir:///workspace/backend/synthi-webrtc-compiler/signaling-server
      - --destination=${_REGISTRY}/synthi-signaling-server:${_IMAGE_TAG}
      - --cache=true
      - --cache-ttl=168h

  # ── 6. Worker (Rust + GStreamer — large image, extended timeout) ────────
  - id: build-worker
    waitFor: ['build-signaling']
    name: gcr.io/kaniko-project/executor:latest@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=backend/synthi-webrtc-compiler/worker/Dockerfile
      - --context=dir:///workspace/backend/synthi-webrtc-compiler/worker
      - --destination=${_REGISTRY}/synthi-worker:${_IMAGE_TAG}
      - --build-arg=INSTALL_ROCM=${_WORKER_INSTALL_ROCM}
      - --cache=true
      - --cache-ttl=168h
    timeout: 1800s

  # ── 7. Prisma Migration Image (lightweight, for K8s Job) ────────────────
  - id: build-prisma-migrate
    waitFor: ['reject-mutable-images']
    name: gcr.io/kaniko-project/executor:latest@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=synthi/Dockerfile.migrate
      - --context=dir:///workspace/synthi
      - --destination=${_REGISTRY}/synthi-prisma-migrate:${_IMAGE_TAG}
      - --cache=true
      - --cache-ttl=168h

  # ── 8. Browser Workflow Bridge + Hosted Browser Runtime ────────────────
  - id: build-browser-workflow-bridge
    waitFor: ['reject-mutable-images']
    name: gcr.io/kaniko-project/executor:latest@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=mcp/synthi-mcp/Dockerfile.workflow-bridge
      # Root context: the MCP package depends on packages/mcp-hub via a local
      # file dependency, matching the frontend workspace image pattern.
      - --context=dir:///workspace
      - --destination=${_REGISTRY}/synthi-browser-workflow-bridge:${_IMAGE_TAG}
      - --cache=false

  # Agent Dojo HTTP MCP host. Built for the release-gate overlay; the default
  # beta kustomization does not deploy this image.
  - id: build-dojo-mcp-host
    waitFor: ['reject-mutable-images']
    name: gcr.io/kaniko-project/executor:debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: /busybox/sh
    env:
      - KUSTOMIZE_DIR=${_KUSTOMIZE_DIR}
      - DOJO_RELEASE_KUSTOMIZE_DIR=${_DOJO_RELEASE_KUSTOMIZE_DIR}
      - REGISTRY=${_REGISTRY}
      - IMAGE_TAG=${_IMAGE_TAG}
    args:
      - -c
      - |
        set -eu
        if [ "$${KUSTOMIZE_DIR}" != "$${DOJO_RELEASE_KUSTOMIZE_DIR}" ]; then
          echo "Skipping Dojo MCP host image build for kustomize dir: $${KUSTOMIZE_DIR}"
          exit 0
        fi
        exec /kaniko/executor \
          --dockerfile=mcp/synthi-mcp/Dockerfile.http \
          --context=dir:///workspace \
          --destination="$${REGISTRY}/synthi-mcp-http:$${IMAGE_TAG}" \
          --cache=false

  # ── 9. Per-workspace runtime image (rootful dind under Sysbox) ──────────
  # ROOTFUL build (RUNTIME_USER=root, daemon at /var/run/docker.sock): under Sysbox
  # the daemon runs unprivileged-but-rootful — Sysbox supplies the userns isolation.
  # The rootless default of this Dockerfile is the LOCAL hybrid image (built separately,
  # not in CI); it crash-loops under Sysbox (rootlesskit can't nest a userns).
  # Pulled at runtime by spawnRuntimePod() only when RUNTIME_BACKEND=sysbox-pod.
  - id: build-runtime-image
    waitFor: ['reject-mutable-images']
    name: gcr.io/kaniko-project/executor:latest@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --dockerfile=backend/runtime-image/Dockerfile
      - --context=dir:///workspace/backend/runtime-image
      - --destination=${_REGISTRY}/vectant-runtime:${_IMAGE_TAG}
      - --build-arg=RUNTIME_BASE=docker:dind@sha256:ad68e89b675740867a3bb96488a93fea9209ad36c6305bfba2664912d6dcf11a
      - --build-arg=RUNTIME_USER=root
      - --build-arg=RUNTIME_HOME=/root
      - --build-arg=DOCKER_SOCK=/var/run/docker.sock
      - --cache=true
      - --cache-ttl=168h

  # ── 10. Vulnerability scan — opt-in full release image fleet ───────────────
  # Disabled by default for beta deploy velocity. Set
  # _ENABLE_VULNERABILITY_SCAN=true to run the CRITICAL CVE gate before
  # deployment. The per-workspace runtime additionally honors its committed
  # waiver file for the known base-bundled grpc CVE. The release-only Dojo MCP
  # host image is scanned when the release-gate overlay is selected.
  - id: vulnerability-scan-images
    waitFor:
      - build-frontend
      - build-collab-server
      - build-ai-engine
      - build-ai-gateway
      - build-signaling
      - build-worker
      - build-prisma-migrate
      - build-browser-workflow-bridge
      - build-dojo-mcp-host
      - build-runtime-image
    name: aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500
    entrypoint: /bin/sh
    env:
      - KUSTOMIZE_DIR=${_KUSTOMIZE_DIR}
      - DOJO_RELEASE_KUSTOMIZE_DIR=${_DOJO_RELEASE_KUSTOMIZE_DIR}
      - REGISTRY=${_REGISTRY}
      - IMAGE_TAG=${_IMAGE_TAG}
      - ENABLE_VULNERABILITY_SCAN=${_ENABLE_VULNERABILITY_SCAN}
    args:
      - -c
      - |
        set -eu
        if [ "$${ENABLE_VULNERABILITY_SCAN}" != "true" ]; then
          echo "Skipping image vulnerability scan because _ENABLE_VULNERABILITY_SCAN=$${ENABLE_VULNERABILITY_SCAN}"
          exit 0
        fi
        scan() {
          echo "Scanning $1"
          trivy image --severity=CRITICAL --exit-code=1 --no-progress --timeout=10m "$1"
        }
        scan "$${REGISTRY}/synthi-frontend:$${IMAGE_TAG}"
        scan "$${REGISTRY}/synthi-collab-server:$${IMAGE_TAG}"
        scan "$${REGISTRY}/synthi-ai-engine:$${IMAGE_TAG}"
        scan "$${REGISTRY}/synthi-ai-gateway:$${IMAGE_TAG}"
        scan "$${REGISTRY}/synthi-signaling-server:$${IMAGE_TAG}"
        scan "$${REGISTRY}/synthi-worker:$${IMAGE_TAG}"
        scan "$${REGISTRY}/synthi-prisma-migrate:$${IMAGE_TAG}"
        scan "$${REGISTRY}/synthi-browser-workflow-bridge:$${IMAGE_TAG}"
        if [ "$${KUSTOMIZE_DIR}" = "$${DOJO_RELEASE_KUSTOMIZE_DIR}" ]; then
          scan "$${REGISTRY}/synthi-mcp-http:$${IMAGE_TAG}"
        fi
        trivy image \
          --severity=CRITICAL \
          --exit-code=1 \
          --ignorefile=backend/runtime-image/.trivyignore \
          --no-progress \
          --timeout=10m \
          "$${REGISTRY}/vectant-runtime:$${IMAGE_TAG}"

  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY — Rolling update on GKE
  # ═══════════════════════════════════════════════════════════════════════════

  - id: get-gke-credentials
    name: gcr.io/cloud-builders/gcloud:latest@sha256:46e6289806bc317cb06c2476ee53631d3e0046edb6743ef4486fd38f13f5ff93
    entrypoint: bash
    args:
      - -c
      - |
        gcloud container clusters get-credentials ${_GKE_CLUSTER} \
          --zone=${_GKE_ZONE} \
          --project=${PROJECT_ID}
    waitFor:
      - build-frontend
      - build-collab-server
      - build-ai-engine
      - build-ai-gateway
      - build-signaling
      - build-worker
      - build-prisma-migrate
      - build-browser-workflow-bridge
      - build-dojo-mcp-host
      - build-runtime-image
      - vulnerability-scan-images

  - id: deploy-to-gke
    name: gcr.io/cloud-builders/kubectl:latest@sha256:0001d965b1fd2d41ef80cb94cc7dfb39d65adbb8ab3855370524b424d897c078
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REGISTRY="${_REGISTRY}"
        MANIFEST_SOURCE_REGISTRY="${_MANIFEST_SOURCE_REGISTRY}"
        TAG="${_IMAGE_TAG}"
        KUSTOMIZE_DIR="${_KUSTOMIZE_DIR}"
        DOJO_RELEASE_KUSTOMIZE_DIR="${_DOJO_RELEASE_KUSTOMIZE_DIR}"
        KUSTOMIZE_LOAD_RESTRICTOR="${_KUSTOMIZE_LOAD_RESTRICTOR}"
        NS="synthi"

        echo "=== Deploying tag: $${TAG} ==="
        echo "=== Region: ${_REGION} ==="
        echo "=== Kustomize dir: $${KUSTOMIZE_DIR} ==="

        if [[ "$${KUSTOMIZE_DIR}" = /* || "$${KUSTOMIZE_DIR}" == *..* ]]; then
          echo "Kustomize dir must be a relative repo path without '..': $${KUSTOMIZE_DIR}" >&2
          exit 1
        fi
        if [[ ! -f "$${KUSTOMIZE_DIR}/kustomization.yaml" ]]; then
          echo "Kustomize dir does not contain kustomization.yaml: $${KUSTOMIZE_DIR}" >&2
          exit 1
        fi
        if [[ -n "$${KUSTOMIZE_LOAD_RESTRICTOR}" && "$${KUSTOMIZE_LOAD_RESTRICTOR}" != "LoadRestrictionsNone" ]]; then
          echo "Unsupported Kustomize load restrictor: $${KUSTOMIZE_LOAD_RESTRICTOR}" >&2
          exit 1
        fi
        if [[ -z "$${MANIFEST_SOURCE_REGISTRY}" ]]; then
          echo "Manifest source registry substitution must not be empty." >&2
          exit 1
        fi

        # Render Kustomize once with the immutable image tag before applying.
        # Applying raw k8s/ directly would briefly roll Deployments to the
        # placeholder image tag "build-tag-required".
        RENDERED="/workspace/.cloudbuild/synthi-k8s.yaml"
        mkdir -p "$$(dirname "$${RENDERED}")"
        KUSTOMIZE_ARGS=("$${KUSTOMIZE_DIR}")
        if [[ -n "$${KUSTOMIZE_LOAD_RESTRICTOR}" ]]; then
          KUSTOMIZE_ARGS+=("--load-restrictor" "$${KUSTOMIZE_LOAD_RESTRICTOR}")
        fi
        kubectl kustomize "$${KUSTOMIZE_ARGS[@]}" > "$${RENDERED}"
        sed -i "s|$${MANIFEST_SOURCE_REGISTRY}|$${REGISTRY}|g" "$${RENDERED}"
        sed -i "s|build-tag-required|$${TAG}|g" "$${RENDERED}"
        if grep -n "build-tag-required" "$${RENDERED}"; then
          echo "Rendered manifests still contain build-tag-required." >&2
          exit 1
        fi

        if [[ "$${KUSTOMIZE_DIR}" == "$${DOJO_RELEASE_KUSTOMIZE_DIR}" ]]; then
          echo "=== Validating Dojo release render contract ==="
          bash scripts/validate-dojo-release-render.sh "$${RENDERED}"

          echo "=== Applying Dojo secret prerequisites ==="
          SECRET_PREREQS="/workspace/.cloudbuild/synthi-secret-prereqs.yaml"
          awk '
            BEGIN { doc = "" }
            function flush() {
              if (doc ~ /(^|\n)[[:space:]]*kind:[[:space:]]*ExternalSecret([[:space:]]|\n)/ ||
                  doc ~ /(^|\n)[[:space:]]*kind:[[:space:]]*SecretStore([[:space:]]|\n)/ ||
                  (doc ~ /(^|\n)[[:space:]]*kind:[[:space:]]*ServiceAccount([[:space:]]|\n)/ &&
                   doc ~ /(^|\n)[[:space:]]*name:[[:space:]]*eso-service-account([[:space:]]|\n)/)) {
                printf "%s---\n", doc
              }
              doc = ""
            }
            /^---[[:space:]]*$/ { flush(); next }
            { doc = doc $0 "\n" }
            END { flush() }
          ' "$${RENDERED}" > "$${SECRET_PREREQS}"
          if [[ ! -s "$${SECRET_PREREQS}" ]]; then
            echo "Dojo overlay did not render External Secrets prerequisites." >&2
            exit 1
          fi
          kubectl apply -f "$${SECRET_PREREQS}"
          kubectl wait --for=condition=Ready externalsecret/synthi-secrets -n $${NS} --timeout=180s
          kubectl wait --for=condition=Ready externalsecret/synthi-dojo-release-secrets -n $${NS} --timeout=180s
        fi

        echo "=== Running Prisma migrations ==="
        kubectl delete job prisma-migrate -n $${NS} --ignore-not-found
        sed "s|$${MANIFEST_SOURCE_REGISTRY}|$${REGISTRY}|g; s|build-tag-required|$${TAG}|g" \
          k8s/prisma-migrate-job.yaml | kubectl apply -f -
        if ! kubectl wait --for=condition=complete job/prisma-migrate -n $${NS} --timeout=300s; then
          kubectl logs job/prisma-migrate -n $${NS} -c migrate || true
          exit 1
        fi
        kubectl logs job/prisma-migrate -n $${NS} -c migrate --tail=100 || true

        echo "=== Applying Kubernetes manifests ==="
        kubectl apply -f "$${RENDERED}"

        echo "=== Waiting for rollouts ==="
        kubectl rollout status deployment/frontend -n $${NS} --timeout=300s
        kubectl rollout status deployment/collab-server -n $${NS} --timeout=300s
        kubectl rollout status deployment/ai-engine -n $${NS} --timeout=300s
        kubectl rollout status deployment/ai-gateway -n $${NS} --timeout=300s
        kubectl rollout status deployment/signaling-server -n $${NS} --timeout=300s
        if [[ "$${KUSTOMIZE_DIR}" == "$${DOJO_RELEASE_KUSTOMIZE_DIR}" ]]; then
          kubectl rollout status deployment/dojo-mcp-host -n $${NS} --timeout=300s
        elif kubectl get deployment/dojo-mcp-host -n $${NS} >/dev/null 2>&1; then
          kubectl rollout status deployment/dojo-mcp-host -n $${NS} --timeout=300s
        fi

        echo "=== Deploy complete ==="
    waitFor:
      - get-gke-credentials

timeout: 3600s
