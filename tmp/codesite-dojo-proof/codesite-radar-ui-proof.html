<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeSite Radar UI Proof</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #08090e;
      color: #f4f5f8;
    }
    body {
      margin: 0;
      padding: 28px;
      background: #08090e;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }
    p {
      margin: 6px 0 0;
      color: #9ba2b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .card {
      overflow: hidden;
      border: 1px solid #24283a;
      border-radius: 8px;
      background: #11131d;
    }
    .card img {
      display: block;
      width: 100%;
      max-height: 640px;
      object-fit: contain;
      background: #05060a;
      border-bottom: 1px solid #24283a;
    }
    .card span {
      display: block;
      padding: 10px 12px;
      color: #cbd1e3;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    code {
      color: #f4f5f8;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>CodeSite Radar UI Proof</h1>
      <p>Docker-backed browser proof for the semantic radar graph, risk cone, replay trace, holding patterns, and landing queue.</p>
      <p>Evidence JSON: <a href="codesite-radar-ui-proof.json"><code>codesite-radar-ui-proof.json</code></a></p>
    </div>
    <p>Stored in repo <code>tmp/codesite-dojo-proof</code></p>
  </header>
  <main class="grid">
    <a class="card" href="codesite-radar-ui-desktop.png">
      <img src="codesite-radar-ui-desktop.png" alt="Desktop CodeSite radar UI proof">
      <span>codesite-radar-ui-desktop.png</span>
    </a>
    <a class="card" href="codesite-radar-ui-mobile.png">
      <img src="codesite-radar-ui-mobile.png" alt="Mobile CodeSite radar UI proof">
      <span>codesite-radar-ui-mobile.png</span>
    </a>
  </main>
</body>
</html>
