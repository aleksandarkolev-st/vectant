[env]
# NOTE: Cargo config `[env]` applies to the build environment (rustc/build.rs),
# not to the runtime environment of the executed binary. Runtime bootstrapping
# is done in Rust (see src/env_setup.rs).

[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/gcc"

[target.x86_64-pc-windows-msvc]
# Use Rust's bundled LLD to avoid requiring MSVC's `link.exe` on dev machines
# where Visual Studio Build Tools aren't installed or PATH resolves a non-MSVC
# `link.exe`.
# linker = "rust-lld.exe"
