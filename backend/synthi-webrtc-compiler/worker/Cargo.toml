[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[lib]
name = "worker"
path = "src/lib.rs"

[[bin]]
name = "worker"
path = "src/main.rs"

[[bin]]
name = "runner"
path = "src/runtime/runner_bin.rs"

[features]
default = []
backtrace = ["dep:backtrace"]
# GPU_HMR_ULTRAPLAN: when enabled, the worker compiles `device.cu` /
# `device.hip` into a sidecar cubin/hsaco alongside the host modules
# and the GPU module adapter participates in hot-reload. Without the
# feature, manifests carrying a `gpu` block still parse (so the worker
# doesn't reject them) but the device-compile stage is a no-op and
# the orchestrator falls through to the host-only path.
gpu-hmr = []

[dependencies]
anyhow = "1.0"
futures = "0.3"
futures-util = "0.3"
lazy_static = "1.4"
object_store = { version = "0.11.0", features = ["gcp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
webrtc = "0.9"
webrtc-util = "0.8"
bytes = "1"
gstreamer = "0.21"
gstreamer-app = "0.21"
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
chrono = { version = "0.4", features = ["serde", "alloc"] }
notify = "8.2.0"
uuid = "1.19.0"
libloading = "0.8"
reqwest = { version = "0.11", features = ["json", "blocking", "stream"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code", "dl-libxcb", "shm", "xtest"] }
libc = "0.2"
setjmp = "0.1"
regex = "1"
rand = "0.8"
backtrace = { version = "0.3", optional = true }
num_cpus = "1.16"
zip = "0.6"
flate2 = "1"
tar = "0.4"
# Binary state serialization (MessagePack - much faster than JSON)
rmp-serde = "1.1"
rmp = "0.8"
byteorder = "1.5"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
# ELF/DWARF parsing for layout hash extraction
object = { version = "0.36", default-features = false, features = ["read", "elf"] }
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
memmap2 = "0.9"
# Phase 11: x86-64 disassembly for integer immediate patching
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "intel", "std"] }
# Phase 11: AST-based value-only classification
tree-sitter = "0.24"
tree-sitter-cpp = "0.23"

[build-dependencies]
tonic-build = "0.11"
protoc-bin-vendored = "3.2.0"

# Patch a local copy of `stun` 0.5.1 in place of the crates.io version
# shipped transitively by webrtc-rs. The local copy fixes the
# `ErrorCodeAttribute` Display impl so a malformed TURN error response
# no longer panics the ICE-agent task. See
# `vendored/stun/README_SYNTHI_PATCH.md` for the full story.
[patch.crates-io]
stun = { path = "vendored/stun" }
