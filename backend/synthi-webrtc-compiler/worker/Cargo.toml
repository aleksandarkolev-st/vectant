[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "worker"
path = "src/main.rs"

[[bin]]
name = "runner"
path = "src/runner_bin.rs"

[features]
default = []
backtrace = ["dep:backtrace"]

[dependencies]
anyhow = "1.0"
futures = "0.3"
futures-util = "0.3"
lazy_static = "1.4"
object_store = { version = "0.11.0", features = ["gcp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
webrtc = "0.9"
bytes = "1"
gstreamer = "0.21"
gstreamer-app = "0.21"
chrono = { version = "0.4", features = ["serde", "alloc"] }
notify = "8.2.0"
uuid = "1.19.0"
libloading = "0.8"
reqwest = { version = "0.11", features = ["json", "blocking", "stream"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code", "dl-libxcb", "shm"] }
libc = "0.2"
setjmp = "0.1"
regex = "1"
backtrace = { version = "0.3", optional = true }
num_cpus = "1.16"
zip = "0.6"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
