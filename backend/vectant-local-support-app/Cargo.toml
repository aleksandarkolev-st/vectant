[package]
name = "vectant-local-support-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "vectant_local_support_app"
path = "src/lib.rs"

[[bin]]
name = "vectant-local-support-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
