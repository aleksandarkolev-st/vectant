[package]
name = "vectant-local-support-desktop"
version = "0.1.0"
description = "Vectant Local Support desktop control surface"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = "0.4"
open = "5"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rfd = "0.16"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
vectant-local-support-app = { path = ".." }

[features]
custom-protocol = ["tauri/custom-protocol"]
live-test-relay = []

[[bin]]
name = "local-support-live-relay"
path = "src/bin/local_support_live_relay.rs"
required-features = ["live-test-relay"]

[dev-dependencies]
axum = "0.7"
